name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., 0.0.1-alpha.0)"
        required: true
        default: dry-run
        type: string

env:
  PYTHON_VERSION: "3.14"

permissions: {}

jobs:
  generate-release:
    name: Generate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release-metadata: ${{ steps.seal-generate.outputs.metadata }}
      tag: ${{ github.event.inputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install seal
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/MatthewMckee4/seal/releases/download/0.0.1-alpha.5/seal-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Generate release metadata
        id: seal-generate
        run: |
          METADATA=$(seal generate release)
          {
            echo "metadata<<EOF"
            echo "$METADATA"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Release metadata:"
          echo "$METADATA"

  build-viewer-local:
    name: Build viewer (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: generate-release
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            packages_install: sudo apt-get update && sudo apt-get install -y musl-tools
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            packages_install: sudo apt-get update && sudo apt-get install -y musl-tools
          - runner: windows-2022
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        uses: ./.github/actions/setup-linux-deps

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-dist
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2
        with:
          tool: cargo-dist@0.31.0

      - name: Install dependencies
        if: matrix.packages_install
        run: ${{ matrix.packages_install }}

      - name: Build binaries
        shell: bash
        env:
          TAG: ${{ needs.generate-release.outputs.tag }}
        run: dist build --tag="${TAG}" --artifacts=local --target=${{ matrix.target }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-${{ matrix.target }}
          path: target/distrib/*.*

  build-viewer-global:
    name: Build viewer installers
    runs-on: ubuntu-22.04
    needs: generate-release
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-dist
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2
        with:
          tool: cargo-dist@0.31.0

      - name: Build global artifacts
        env:
          TAG: ${{ needs.generate-release.outputs.tag }}
        run: dist build --tag="${TAG}" --artifacts=global

      - name: Upload global artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-global
          path: target/distrib/*

  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [generate-release, build-viewer-local, build-viewer-global]
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Parse release metadata
        id: parse-metadata
        env:
          METADATA: ${{ needs.generate-release.outputs.release-metadata }}
        run: |
          TITLE=$(echo "$METADATA" | jq -r '.title')
          BODY=$(echo "$METADATA" | jq -r '.body')
          PRERELEASE=$(echo "$METADATA" | jq -r '.prerelease')

          {
            echo "title=$TITLE"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

          # Save body to file to handle multiline content
          echo "$BODY" > "$RUNNER_TEMP/release-notes.txt"

      - name: Create GitHub release
        env:
          TAG: ${{ needs.generate-release.outputs.tag }}
          TITLE: ${{ steps.parse-metadata.outputs.title }}
          PRERELEASE: ${{ steps.parse-metadata.outputs.prerelease }}
        run: |
          ARGS=(
            "$TAG"
            --title "$TITLE"
            --notes-file "$RUNNER_TEMP/release-notes.txt"
          )

          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=(--prerelease)
          fi

          gh release create "${ARGS[@]}"

      - name: Upload artifacts to release
        env:
          TAG: ${{ needs.generate-release.outputs.tag }}
        run: gh release upload "$TAG" artifacts/* --clobber

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: create-release
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish gdsr to crates.io
        run: cargo publish -p gdsr
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish gdsr-viewer to crates.io
        run: cargo publish -p gdsr-viewer
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-docs:
    name: Publish documentation
    runs-on: ubuntu-latest
    needs: create-release
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false

      - name: Prepare docs
        run: uv run --script scripts/prepare_docs.py

      - name: Build docs
        run: uv run --isolated --with-requirements docs/requirements.txt zensical build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          publish_branch: gh-pages
          keep_files: false
          force_orphan: true
