[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
homepage = "https://github.com/MatthewMckee4/gdsr"
documentation = "https://github.com/MatthewMckee4/gdsr"
repository = "https://github.com/MatthewMckee4/gdsr"
authors = ["Matthew McKee <matthewmckee4@yahoo.co.uk>"]
license = "MIT"

[workspace.dependencies]
gdsr_core = { path = "crates/gdsr_core" }

bytemuck = "1.16.1"
byteorder = "1.5.0"
chrono = "0.4.38"
inventory = "0.3.15"
log = "0.4.22"
plotly = "0.9.0"
pyo3 = { version = "0.22.2", features = [
    "extension-module",
    "multiple-pymethods",
    "py-clone",
] }
pyo3-log = "0.11.0"
tempfile = "3.10.1"
geo = "0.28"
approx = "0.5"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
