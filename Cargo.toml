[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
# Please update rustfmt.toml when bumping the Rust edition.
edition = "2024"
rust-version = "1.95"
homepage = "https://github.com/MatthewMckee4/gdsr"
authors = ["Matthew Mckee <matthewmckee04@yahoo.co.uk>"]
license = "MIT"

[workspace.dependencies]
gdsr = { path = "crates/gdsr", version = "0.0.1-alpha.3" }

approx = "0.5"
bevy = { version = "0.19.0", default-features = false, features = [
    "async_executor",
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_log",
    "bevy_mesh",
    "bevy_render",
    "bevy_shader",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_text",
    "bevy_window",
    "bevy_winit",
    "default_font",
    "keyboard",
    "mouse",
    "multi_threaded",
    "png",
    "reflect_auto_register",
    "std",
    "touch",
    "wayland",
    "x11",
] }
bevy_egui = { version = "0.41.1", default-features = false, features = [
    "default_fonts",
    "manage_clipboard",
    "open_url",
    "render",
] }
bytemuck = "1.25.0"
chrono = "0.4.44"
clap = "4.5.55"
criterion = { package = "codspeed-criterion-compat", version = "5" }
earcutr = "0.5"
egui = "0.34.3"
geo = { version = "0.33.1", default-features = false, features = ["earcut"] }
insta = "1.46.3"
log = "0.4"
quickcheck = "1.1.0"
quickcheck_macros = "1"
rayon = "1"
rfd = "0.17"
rstest = "0.26.1"
tempfile = "3.26"

[workspace.metadata.dist]
allow-dirty = ["ci"]
cargo-dist-version = "0.31.0"
ci = "github"
installers = ["shell", "powershell"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

# Allowed pedantic lints
char_lit_as_u8 = "allow"
collapsible_else_if = "allow"
collapsible_if = "allow"
implicit_hasher = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
option_if_let_else = "allow"
significant_drop_tightening = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
suboptimal_flops = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
used_underscore_binding = "allow"
collapsible_match = "allow"
# Disallowed restriction lints
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
get_unwrap = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
if_not_else = "allow"
use_self = "warn"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
float_cmp = "allow"
cast_possible_wrap = "allow"

[workspace.lints.rust]
unsafe_code = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(codspeed)"] }

[profile.dist]
inherits = "release"
lto = "thin"
