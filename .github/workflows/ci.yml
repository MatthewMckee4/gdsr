name: Continuous Integration

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  PYTHON_VERSION: "3.14"
  RUSTUP_MAX_RETRIES: 10

jobs:
  determine_changes:
    name: "determine changes"

    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      # Flag that is raised when any code is changed
      code: ${{ steps.check_code.outputs.changed }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine merge base
        id: merge_base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          sha=$(git merge-base HEAD "origin/${BASE_REF}")
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Check if there was any code related change
        id: check_code
        env:
          MERGE_BASE: ${{ steps.merge_base.outputs.sha }}
        run: |
          if git diff --quiet "${MERGE_BASE}...HEAD" -- \
            . \
            ':!.gitattributes' \
            ':!.github/CODEOWNERS' \
            ':!.github/FUNDING.yml' \
            ':!.github/ISSUE_TEMPLATE/**' \
            ':!.github/PULL_REQUEST_TEMPLATE.md' \
            ':!.github/actionlint.yaml' \
            ':!.github/codecov.yml' \
            ':!.github/dependabot.yml' \
            ':!.github/zizmor.yml' \
            ':!docs/' \
            ':!.markdownlint.yaml' \
            ':!.pre-commit-config.yaml' \
            ':!AGENTS.md' \
            ':!CHANGELOG.md' \
            ':!CODE_OF_CONDUCT.md' \
            ':!CONTRIBUTING.md' \
            ':!LICENSE' \
            ':!README.md' \
            ':!SECURITY.md' \
            ':!rustfmt.toml' \
            ':!rust-toolchain.toml' \
            ':!seal.toml' \
            ':!zensical.toml' \
          ; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  pre-commit:
    name: "pre commit"

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-linux-deps

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: "Install Rust components"
        run: rustup component add rustfmt clippy

      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0

  build-docs:
    name: "Build docs"

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false

      - name: Prepare docs
        run: uv run --script scripts/prepare_docs.py

      - name: Build docs
        run: uv run --isolated --with-requirements docs/requirements.txt zensical build

      - name: Check Rust docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps

  msrv:
    name: "MSRV"

    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs: determine_changes
    if: ${{ (needs.determine_changes.outputs.code == 'true' || github.ref == 'refs/heads/main') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read declared MSRV
        id: msrv
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Check MSRV
        run: cargo check --workspace --all-targets --all-features

  cargo-test:
    name: "cargo test (${{ matrix.os }})"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    needs: determine_changes
    if: ${{ (needs.determine_changes.outputs.code == 'true' || github.ref == 'refs/heads/main') }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-linux-deps

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: "Install Rust toolchain"
        run: rustup show

      - name: "Install cargo nextest"
        uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2.85.6
        with:
          tool: cargo-nextest

      - name: Run tests
        run: cargo nextest run

  coverage:
    name: "coverage"

    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs: determine_changes

    if: ${{ (needs.determine_changes.outputs.code == 'true' || github.ref == 'refs/heads/main') }}

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-linux-deps

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: "Install Rust toolchain"
        run: rustup show

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2.85.6
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Generate code coverage
        run: cargo llvm-cov nextest --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: lcov.info
          slug: MatthewMckee4/gdsr
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

  benchmarks:
    name: "benchmarks"

    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs: determine_changes

    if: ${{ (needs.determine_changes.outputs.code == 'true' || github.ref == 'refs/heads/main') }}

    env:
      RAYON_NUM_THREADS: 1

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-linux-deps

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: "Install Rust toolchain"
        run: rustup show

      - name: "Install cargo-codspeed"
        uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2.85.6
        with:
          tool: cargo-codspeed

      - name: "Build benchmarks"
        run: cargo codspeed build -p gdsr-benchmark --bench io -m simulation

      - name: "Run benchmarks"
        uses: CodSpeedHQ/action@88472375d0a4572cf70a9f1fe3a4e0ab8da1b924 # v5.0.1
        with:
          run: cargo codspeed run -p gdsr-benchmark --bench io -m simulation
          mode: simulation

  ci-gate:
    name: "CI gate"

    runs-on: ubuntu-latest
    timeout-minutes: 5

    needs:
      - determine_changes
      - pre-commit
      - build-docs
      - msrv
      - cargo-test
      - coverage
      - benchmarks
    if: ${{ always() }}

    steps:
      - name: Require successful validation
        env:
          BENCHMARKS_RESULT: ${{ needs.benchmarks.result }}
          BUILD_DOCS_RESULT: ${{ needs.build-docs.result }}
          CARGO_TEST_RESULT: ${{ needs.cargo-test.result }}
          CODE_CHANGED: ${{ needs.determine_changes.outputs.code }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          DETERMINE_CHANGES_RESULT: ${{ needs.determine_changes.result }}
          PRE_COMMIT_RESULT: ${{ needs.pre-commit.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
        run: |
          require_success() {
            if [ "$2" != "success" ]; then
              echo "::error::$1 finished with result '$2'"
              exit 1
            fi
          }

          require_code_validation() {
            case "$2" in
              success)
                ;;
              skipped)
                if [ "$CODE_CHANGED" != "false" ] || [ "$GITHUB_REF" = "refs/heads/main" ]; then
                  echo "::error::$1 was unexpectedly skipped"
                  exit 1
                fi
                ;;
              *)
                echo "::error::$1 finished with result '$2'"
                exit 1
                ;;
            esac
          }

          require_success "determine changes" "$DETERMINE_CHANGES_RESULT"
          require_success "pre commit" "$PRE_COMMIT_RESULT"
          require_success "Build docs" "$BUILD_DOCS_RESULT"

          if [ "$CODE_CHANGED" != "true" ] && [ "$CODE_CHANGED" != "false" ]; then
            echo "::error::determine changes produced unexpected code output '$CODE_CHANGED'"
            exit 1
          fi

          require_code_validation "coverage" "$COVERAGE_RESULT"
          require_code_validation "cargo test" "$CARGO_TEST_RESULT"
          require_code_validation "benchmarks" "$BENCHMARKS_RESULT"
          require_code_validation "MSRV" "$MSRV_RESULT"
