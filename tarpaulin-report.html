    timestamp.month() as u16,\n        timestamp.day() as u16,\n        timestamp.hour() as u16,\n        timestamp.minute() as u16,\n        timestamp.second() as u16,\n    ];\n\n    write_u16_array_to_file(file, \u0026head_start)?;\n\n    write_string_with_record_to_file(file, GDSRecord::LibName, library_name)?;\n\n    let head_units = [\n        20,\n        combine_record_and_data_type(GDSRecord::Units, GDSDataType::EightByteReal),\n    ];\n    write_u16_array_to_file(file, \u0026head_units)?;\n\n    write_float_to_eight_byte_real_to_file(file, user_units)?;\n    write_float_to_eight_byte_real_to_file(file, database_units)\n}\n\npub fn write_gds_tail_to_file(file: \u0026mut File) -\u003e io::Result\u003c()\u003e {\n    let tail = [\n        4,\n        combine_record_and_data_type(GDSRecord::EndLib, GDSDataType::NoData),\n    ];\n    write_u16_array_to_file(file, \u0026tail)\n}\n\npub fn write_u16_array_to_file(file: \u0026mut File, array: \u0026[u16]) -\u003e io::Result\u003c()\u003e {\n    let u16_array_to_big_endian = u16_array_to_big_endian(array);\n    file.write_all(cast_slice(\u0026u16_array_to_big_endian))\n}\n\npub fn write_float_to_eight_byte_real_to_file(file: \u0026mut File, value: f64) -\u003e io::Result\u003c()\u003e {\n    let value = eight_byte_real(value);\n    file.write_all(\u0026value)\n}\n\npub fn write_points_to_file\u003cDatabaseUnitT: CoordNum\u003e(\n    file: \u0026mut File,\n    points: \u0026[Point\u003cDatabaseUnitT\u003e],\n    scale: f64,\n    to_integer: \u0026dyn Fn(DatabaseUnitT) -\u003e DatabaseIntegerUnit,\n) -\u003e io::Result\u003c()\u003e {\n    let new_points: Vec\u003cPoint\u003cDatabaseIntegerUnit\u003e\u003e = points\n        .iter()\n        .map(|point| Point::new(to_integer(point.x()), to_integer(point.y())))\n        .collect();\n\n    write_integer_points_to_file(file, \u0026new_points, scale)\n}\n\npub fn write_integer_points_to_file(\n    file: \u0026mut File,\n    points: \u0026[Point\u003cDatabaseIntegerUnit\u003e],\n    scale: f64,\n) -\u003e io::Result\u003c()\u003e {\n    const MAX_POINTS: usize = 8191;\n    let points_to_write = points.get(..MAX_POINTS).unwrap_or(points);\n\n    let record_size = 4 + (points.len() * 8) as u16;\n    let xy_header_buffer = [\n        record_size,\n        combine_record_and_data_type(GDSRecord::XY, GDSDataType::FourByteSignedInteger),\n    ];\n\n    write_u16_array_to_file(file, \u0026xy_header_buffer)?;\n\n    for point in points_to_write {\n        let scaled_x = (point.x() as f64 * scale).round() as i32;\n        let scaled_y = (point.y() as f64 * scale).round() as i32;\n\n        file.write_all(\u0026scaled_x.to_be_bytes())?;\n        file.write_all(\u0026scaled_y.to_be_bytes())?;\n    }\n\n    Ok(())\n}\n\npub fn write_element_tail_to_file(file: \u0026mut File) -\u003e io::Result\u003c()\u003e {\n    let tail = [\n        4,\n        combine_record_and_data_type(GDSRecord::EndEl, GDSDataType::NoData),\n    ];\n    write_u16_array_to_file(file, \u0026tail)\n}\n\npub fn write_string_with_record_to_file(\n    file: \u0026mut File,\n    record: GDSRecord,\n    string: \u0026str,\n) -\u003e io::Result\u003c()\u003e {\n    let mut len = string.len();\n    if len % 2 != 0 {\n        len += 1;\n    }\n\n    let mut lib_name_bytes = string.as_bytes().to_vec();\n\n    if string.len() % 2 != 0 {\n        lib_name_bytes.push(0);\n    }\n\n    let string_start = [\n        (4 + len) as u16,\n        combine_record_and_data_type(record, GDSDataType::AsciiString),\n    ];\n\n    write_u16_array_to_file(file, \u0026string_start)?;\n\n    file.write_all(\u0026lib_name_bytes)\n}\n\npub fn write_gds\u003c'a, T: CoordNum + 'a\u003e(\n    file_name: String,\n    library_name: \u0026str,\n    user_units: f64,\n    database_units: f64,\n    cells: impl Iterator\u003cItem = \u0026'a Cell\u003cT\u003e\u003e,\n) -\u003e io::Result\u003c()\u003e {\n    let mut file = File::create(file_name)?;\n\n    write_gds_head_to_file(library_name, user_units, database_units, \u0026mut file)?;\n\n    let mut written_cell_names: HashSet\u003cString\u003e = HashSet::new();\n\n    for cell in cells {\n        if !written_cell_names.contains(\u0026cell.name) {\n            written_cell_names.insert(cell.name.clone());\n            cell.to_gds_impl(\n                \u0026mut file,\n                user_units,\n                database_units,\n                \u0026mut written_cell_names,\n            )?;\n        }\n    }\n\n    write_gds_tail_to_file(\u0026mut file)?;\n\n    file.flush()\n}\n\npub fn write_transformation_to_file(\n    file: \u0026mut File,\n    angle: f64,\n    magnification: f64,\n    x_reflection: bool,\n) -\u003e io::Result\u003c()\u003e {\n    let transform_applied = angle != 0.0 || magnification != 1.0 || x_reflection;\n    if transform_applied {\n        let buffer_flags = [\n            6,\n            combine_record_and_data_type(GDSRecord::STrans, GDSDataType::BitArray),\n            if x_reflection { 0x8000 } else { 0x0000 },\n        ];\n\n        write_u16_array_to_file(file, \u0026buffer_flags)?;\n\n        if magnification != 1.0 {\n            let buffer_mag = [\n                12,\n                combine_record_and_data_type(GDSRecord::Mag, GDSDataType::EightByteReal),\n            ];\n            write_u16_array_to_file(file, \u0026buffer_mag)?;\n            write_float_to_eight_byte_real_to_file(file, magnification)?;\n        }\n\n        if angle != 0.0 {\n            let buffer_rot = [\n                12,\n                combine_record_and_data_type(GDSRecord::Angle, GDSDataType::EightByteReal),\n            ];\n            write_u16_array_to_file(file, \u0026buffer_rot)?;\n            write_float_to_eight_byte_real_to_file(file, angle)?;\n        }\n    }\n\n    Ok(())\n}\n\n#[allow(clippy::too_many_lines, clippy::cognitive_complexity)]\npub fn from_gds\u003cDatabaseUnitT: CoordNum\u003e(file_name: String) -\u003e io::Result\u003cLibrary\u003cDatabaseUnitT\u003e\u003e {\n    let mut library = Library::new(\"Library\");\n\n    let file = File::open(file_name)?;\n    let reader = RecordReader::new(BufReader::new(file));\n\n    let mut cell: Option\u003cCell\u003cDatabaseUnitT\u003e\u003e = None;\n    let mut path: Option\u003cPath\u003cDatabaseUnitT\u003e\u003e = None;\n    let mut polygon: Option\u003cPolygon\u003cDatabaseUnitT\u003e\u003e = None;\n    let mut text: Option\u003cText\u003cDatabaseUnitT\u003e\u003e = None;\n    let mut reference: Option\u003cReference\u003cDatabaseUnitT\u003e\u003e = None;\n\n    let mut scale = 1.0;\n\n    for record in reader {\n        match record {\n            Ok((record_type, data)) =\u003e match record_type {\n                GDSRecord::LibName =\u003e {\n                    if let GDSRecordData::Str(name) = data {\n                        library.name = name;\n                    }\n                }\n                GDSRecord::Units =\u003e {\n                    if let GDSRecordData::F64(units) = data {\n                        scale = units[1] / units[0];\n                    }\n                }\n                GDSRecord::EndLib =\u003e {\n                    update_references(\u0026mut library);\n                }\n                GDSRecord::BgnStr =\u003e {\n                    cell = Some(Cell::default());\n                }\n                GDSRecord::StrName =\u003e {\n                    if let GDSRecordData::Str(cell_name) = data {\n                        if let Some(cell) = \u0026mut cell {\n                            cell.name = cell_name;\n                        }\n                    }\n                }\n                GDSRecord::EndStr =\u003e {\n                    if let Some(cell) = cell.take() {\n                        library.cells.insert(cell.name.clone(), cell);\n                    }\n                }\n                GDSRecord::Boundary | GDSRecord::Box =\u003e {\n                    polygon = Some(Polygon::default());\n                }\n                GDSRecord::Path | GDSRecord::RaithMbmsPath =\u003e {\n                    path = Some(Path::default());\n                }\n                GDSRecord::ARef | GDSRecord::SRef =\u003e {\n                    reference = Some(Reference::default());\n                }\n                GDSRecord::Text =\u003e {\n                    text = Some(Text::default());\n                }\n                GDSRecord::Layer =\u003e {\n                    if let GDSRecordData::I16(layer) = data {\n                        let layer_value = layer[0] as Layer;\n                        if let Some(polygon) = \u0026mut polygon {\n                            polygon.layer = layer_value;\n                        } else if let Some(path) = \u0026mut path {\n                            path.layer = layer_value;\n                        } else if let Some(text) = \u0026mut text {\n                            text.layer = layer_value;\n                        }\n                    }\n                }\n                GDSRecord::DataType | GDSRecord::BoxType =\u003e {\n                    if let GDSRecordData::I16(data_type) = data {\n                        let data_type_val = data_type[0] as DataType;\n                        if let Some(polygon) = \u0026mut polygon {\n                            polygon.data_type = data_type_val;\n                        } else if let Some(path) = \u0026mut path {\n                            path.data_type = data_type_val;\n                        }\n                    }\n                }\n                GDSRecord::Width =\u003e {\n                    if let GDSRecordData::I32(width) = data {\n                        let path_width = round_to_decimals(f64::from(width[0]) * scale, 10);\n                        if let Some(path) = \u0026mut path {\n                            path.width = Some(path_width);\n                        }\n                    }\n                }\n                GDSRecord::XY =\u003e {\n                    if let GDSRecordData::I32(xy) = data {\n                        let points = get_points_from_i32_vec::\u003cDatabaseUnitT\u003e(\u0026xy)\n                            .iter()\n                            .map(|p| {\n                                Point::new(\n                                    DatabaseUnitT::from_float(p.x().to_float() * scale),\n                                    DatabaseUnitT::from_float(p.y().to_float() * scale),\n                                )\n                            })\n                            .collect::\u003cVec\u003cPoint\u003cDatabaseUnitT\u003e\u003e\u003e();\n\n                        if let Some(polygon) = \u0026mut polygon {\n                            polygon.points = points;\n                        } else if let Some(path) = \u0026mut path {\n                            path.points = points;\n                        } else if let Some(reference) = \u0026mut reference {\n                            match points.len() {\n                                1 =\u003e {\n                                    reference.grid.origin = points[0];\n                                }\n                                3 =\u003e {\n                                    let origin = points[0];\n                                    let rotated_points = points\n                                        .iter()\n                                        .map(|\u0026p| {\n                                            point_to_database_unit(\n                                                point_to_database_float(p).rotate_around_point(\n                                                    -reference.grid.angle,\n                                                    point_to_database_float(origin),\n                                                ),\n                                            )\n                                        })\n                                        .collect::\u003cVec\u003cPoint\u003cDatabaseUnitT\u003e\u003e\u003e();\n\n                                    reference.grid.origin = rotated_points[0];\n\n                                    reference.grid.spacing_x = if reference.grid.columns \u003e 0 {\n                                        (rotated_points[1] - rotated_points[0])\n                                            / DatabaseUnitT::from_float(f64::from(\n                                                reference.grid.columns,\n                                            ))\n                                    } else {\n                                        Point::new(DatabaseUnitT::zero(), DatabaseUnitT::zero())\n                                    };\n                                    reference.grid.spacing_y = if reference.grid.rows \u003e 0 {\n                                        (rotated_points[2] - rotated_points[0])\n                                            / DatabaseUnitT::from_float(f64::from(\n                                                reference.grid.rows,\n                                            ))\n                                    } else {\n                                        Point::new(DatabaseUnitT::zero(), DatabaseUnitT::zero())\n                                    };\n                                }\n                                _ =\u003e {}\n                            }\n                        } else if let Some(text) = \u0026mut text {\n                            if let Some(\u0026first_point) = points.first() {\n                                text.origin = first_point;\n                            }\n                        }\n                    }\n                }\n                GDSRecord::EndEl =\u003e {\n                    if let Some(cell) = \u0026mut cell {\n                        if let Some(polygon) = polygon.take() {\n                            cell.polygons.push(polygon);\n                        } else if let Some(path) = path.take() {\n                            cell.paths.push(path);\n                        } else if let Some(reference) = reference.take() {\n                            cell.references.push(reference);\n                        } else if let Some(text) = text.take() {\n                            cell.texts.push(text);\n                        }\n                    }\n                    polygon = None;\n                    path = None;\n                    text = None;\n                    reference = None;\n                }\n                GDSRecord::SName =\u003e {\n                    if let GDSRecordData::Str(cell_name) = data {\n                        if let Some(reference) = \u0026mut reference {\n                            if let Instance::Cell(cell) = \u0026mut reference.instance {\n                                cell.name = cell_name;\n                            }\n                        }\n                    }\n                }\n                GDSRecord::ColRow =\u003e {\n                    if let GDSRecordData::I16(col_row) = data {\n                        if let Some(reference) = \u0026mut reference {\n                            reference.grid.columns = col_row[0] as u32;\n                            reference.grid.rows = col_row[1] as u32;\n                        }\n                    }\n                }\n                GDSRecord::Presentation =\u003e {\n                    if let GDSRecordData::I16(flags) = data {\n                        if let Some(text) = \u0026mut text {\n                            if let Ok((vertical_presentation, horizontal_presentation)) =\n                                get_presentations_from_value(flags[0])\n                            {\n                                text.vertical_presentation = vertical_presentation;\n                                text.horizontal_presentation = horizontal_presentation;\n                            }\n                        }\n                    }\n                }\n                GDSRecord::String =\u003e {\n                    if let GDSRecordData::Str(string) = data {\n                        i ments = reference.flatten(None);\n\n    for element in elements {\n        cell.add(element);\n    }\n\n    let mut cell2 = Cell::new(\"precision_cell2\");\n\n    let polygon2 = Polygon::new([(0, 0), (100, 0), (100, 100), (0, 100)], 1, 0);\n\n    cell2.add(polygon2);\n\n    let reference2 = Reference::new(\n        cell2.clone(),\n        Grid::new((0, 0), 3, 3, (150, 0), (0, 150), 0.0, 0.0, false),\n    );\n\n    cell.add(reference2);\n\n    library.add(cell);\n    library.add(cell2);\n\n    let _res = library.to_gds(gds_path.to_str().unwrap(), user_units, database_units);\n\n    let new_library: Library\u003cDatabaseIntegerUnit\u003e =\n        Library::from_gds(gds_path.to_str().unwrap()).unwrap();\n\n    assert_eq!(library, new_library);\n}\n\n#[test]\nfn test_empty_library_roundtrip() {\n    let temp_dir = tempdir().unwrap();\n    let gds_path = temp_dir.path().join(\"empty.gds\");\n\n    let library = Library::new(\"empty_lib\");\n\n    let _res = library.to_gds(gds_path.to_str().unwrap(), 1e-9, 1e-10);\n\n    let new_library: Library\u003cDatabaseIntegerUnit\u003e =\n        Library::from_gds(gds_path.to_str().unwrap()).unwrap();\n\n    assert_eq!(library, new_library);\n}\n","traces":[],"covered":0,"coverable":0}]};

    <script>const e = React.createElement;

function pathToString(path) {
  if (path[0] === '/') {
    return '/' + path.slice(1).join('/');
  } else {
    return path.join('/');
  }
}

function findCommonPath(files) {
  if (!files || !files.length) {
    return [];
  }

  function isPrefix(arr, prefix) {
    if (arr.length < prefix.length) {
      return false;
    }
    for (let i = prefix.length - 1; i >= 0; --i) {
      if (arr[i] !== prefix[i]) {
        return false;
      }
    }
    return true;
  }

  let commonPath = files[0].path.slice(0, -1);
  while (commonPath.length) {
    if (files.every(file => isPrefix(file.path, commonPath))) {
      break;
    }
    commonPath.pop();
  }
  return commonPath;
}

function findFolders(files) {
  if (!files || !files.length) {
    return [];
  }

  let folders = files.filter(file => file.path.length > 1).map(file => file.path[0]);
  folders = [...new Set(folders)]; // unique
  folders.sort();

  folders = folders.map(folder => {
    let filesInFolder = files
      .filter(file => file.path[0] === folder)
      .map(file => ({
        ...file,
        path: file.path.slice(1),
        parent: [...file.parent, file.path[0]],
      }));

    const children = findFolders(filesInFolder); // recursion

    return {
      is_folder: true,
      path: [folder],
      parent: files[0].parent,
      children,
      covered: children.reduce((sum, file) => sum + file.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.coverable, 0),
      prevRun: {
        covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
        coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
      }
    };
  });

  return [
    ...folders,
    ...files.filter(file => file.path.length === 1),
  ];
}

class App extends React.Component {
  constructor(...args) {
    super(...args);

    this.state = {
      current: [],
    };
  }

  componentDidMount() {
    this.updateStateFromLocation();
    window.addEventListener("hashchange", () => this.updateStateFromLocation(), false);
  }

  updateStateFromLocation() {
    if (window.location.hash.length > 1) {
      const current = window.location.hash.substr(1).split('/');
      this.setState({current});
    } else {
      this.setState({current: []});
    }
  }

  getCurrentPath() {
    let file = this.props.root;
    let path = [file];
    for (let p of this.state.current) {
      file = file.children.find(file => file.path[0] === p);
      if (!file) {
        return path;
      }
      path.push(file);
    }
    return path;
  }

  render() {
    const path = this.getCurrentPath();
    const file = path[path.length - 1];

    let w = null;
    if (file.is_folder) {
      w = e(FilesList, {
        folder: file,
        onSelectFile: this.selectFile.bind(this),
        onBack: path.length > 1 ? this.back.bind(this) : null,
      });
    } else {
      w = e(DisplayFile, {
        file,
        onBack: this.back.bind(this),
      });
    }

    return e('div', {className: 'app'}, w);
  }

  selectFile(file) {
    this.setState(({current}) => {
      return {current: [...current, file.path[0]]};
    }, () => this.updateHash());
  }

  back(file) {
    this.setState(({current}) => {
      return {current: current.slice(0, current.length - 1)};
    }, () => this.updateHash());
  }

  updateHash() {
    if (!this.state.current || !this.state.current.length) {
      window.location = '#';
    } else {
      window.location = '#' + this.state.current.join('/');
    }
  }
}

function FilesList({folder, onSelectFile, onBack}) {
  let files = folder.children;
  return e('div', {className: 'display-folder'},
    e(FileHeader, {file: folder, onBack}),
    e('table', {className: 'files-list'},
      e('thead', {className: 'files-list__head'},
        e('tr', null,
          e('th', null, "Path"),
          e('th', null, "Coverage")
        )
      ),
      e('tbody', {className: 'files-list__body'},
        files.map(file => e(File, {file, onClick: onSelectFile}))
      )
    )
  );
}

function File({file, onClick}) {
  const coverage = file.coverable ? file.covered / file.coverable * 100 : -1;
  const coverageDelta = file.prevRun &&
    (file.covered / file.coverable * 100 - file.prevRun.covered / file.prevRun.coverable * 100);

  return e('tr', {
      className: 'files-list__file'
        + (coverage >= 0 && coverage < 50 ? ' files-list__file_low': '')
        + (coverage >= 50 && coverage < 80 ? ' files-list__file_medium': '')
        + (coverage >= 80 ? ' files-list__file_high': '')
        + (file.is_folder ? ' files-list__file_folder': ''),
      onClick: () => onClick(file),
    },
    e('td', null, e('a', null, pathToString(file.path))),
    e('td', null,
      file.covered + ' / ' + file.coverable +
      (coverage >= 0 ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e('span', {title: 'Change from the previous run'},
        (coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : ''))
    )
  );
}

function DisplayFile({file, onBack}) {
  return e('div', {className: 'display-file'},
    e(FileHeader, {file, onBack}),
    e(FileContent, {file})
  );
}

function FileHeader({file, onBack}) {
  const coverage = file.covered / file.coverable * 100;
  const coverageDelta = file.prevRun && (coverage - file.prevRun.covered / file.prevRun.coverable * 100);

  return e('div', {className: 'file-header'},
    onBack ? e('a', {className: 'file-header__back', onClick: onBack}, 'Back') : null,
    e('div', {className: 'file-header__name'}, pathToString([...file.parent, ...file.path])),
    e('div', {className: 'file-header__stat'},
      'Covered: ' + file.covered + ' of ' + file.coverable +
      (file.coverable ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e('span', {title: 'Change from the previous run'},
        (coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : ''))
    )
  );
}

function FileContent({file}) {
  return e('pre', {className: 'file-content'},
    file.content.split(/\r?\n/).map((line, index) => {
      const trace = file.traces.find(trace => trace.line === index + 1);
      const covered = trace && trace.stats.Line;
      const uncovered = trace && !trace.stats.Line;
      return e('code', {
          className: 'code-line'
            + (covered ? ' code-line_covered' : '')
            + (uncovered ? ' code-line_uncovered' : ''),
          title: trace ? JSON.stringify(trace.stats, null, 2) : null,
        }, line);
    })
  );
}

(function(){
  const commonPath = findCommonPath(data.files);
  const prevFilesMap = new Map();

  previousData && previousData.files.forEach((file) => {
    const path = file.path.slice(commonPath.length).join('/');
    prevFilesMap.set(path, file);
  });

  const files = data.files.map((file) => {
    const path = file.path.slice(commonPath.length);
    const { covered = 0, coverable = 0 } = prevFilesMap.get(path.join('/')) || {};
    return {
      ...file,
      path,
      parent: commonPath,
      prevRun: { covered, coverable },
    };
  });

  const children = findFolders(files);

  const root = {
    is_folder: true,
    children,
    path: commonPath,
    parent: [],
    covered: children.reduce((sum, file) => sum + file.covered, 0),
    coverable: children.reduce((sum, file) => sum + file.coverable, 0),
    prevRun: {
      covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
    }
  };

  ReactDOM.render(e(App, {root, prevFilesMap}), document.getElementById('root'));
}());
</script>
