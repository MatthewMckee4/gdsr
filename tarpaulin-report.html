3e {\n    fn move_to(\u0026self, target: Point\u003cDatabaseIntegerUnit\u003e) -\u003e Self {\n        let first_point = \u0026self.points()[0];\n        let delta = Point::new(\n            DatabaseIntegerUnit::from_float(target.x().to_float() - first_point.x().to_float()),\n            DatabaseIntegerUnit::from_float(target.y().to_float() - first_point.y().to_float()),\n        );\n        self.move_by(delta)\n    }\n}\n\nimpl Dimensions\u003cDatabaseFloatUnit\u003e for Path\u003cDatabaseIntegerUnit\u003e {\n    fn bounding_box(\u0026self) -\u003e (Point\u003cDatabaseFloatUnit\u003e, Point\u003cDatabaseFloatUnit\u003e) {\n        let to_database_float = |point: Point\u003cDatabaseIntegerUnit\u003e| {\n            Point::new(\n                point.x() as DatabaseFloatUnit,\n                point.y() as DatabaseFloatUnit,\n            )\n        };\n\n        if let Some(width) = self.width()\n            \u0026\u0026 width \u003e 0.0\n        {\n            // For paths with width, we need to consider the extended points\n            let half_width = width / 2.0;\n\n            // Create extended points considering the width\n            let mut extended_points = Vec::new();\n\n            for i in 0..self.points().len() {\n                let point = to_database_float(self.points()[i]);\n\n                // Add points offset by half-width in perpendicular directions\n                if i \u003e 0 {\n                    let prev = to_database_float(self.points()[i - 1]);\n\n                    let dx = point.x() - prev.x();\n                    let dy = point.y() - prev.y();\n                    let len = dx.mul_add(dx, dy * dy).sqrt();\n                    if len \u003e 0.0 {\n                        let nx = -dy / len * half_width;\n                        let ny = dx / len * half_width;\n                        extended_points.push(Point::new(point.x() + nx, point.y() + ny));\n                        extended_points.push(Point::new(point.x() - nx, point.y() - ny));\n                    }\n                }\n\n                if i \u003c self.points().len() - 1 {\n                    let next = to_database_float(self.points()[i + 1]);\n\n                    let dx = next.x() - point.x();\n                    let dy = next.y() - point.y();\n                    let len = dx.hypot(dy);\n                    if len \u003e 0.0 {\n                        let nx = -dy / len * half_width;\n                        let ny = dx / len * half_width;\n                        extended_points.push(Point::new(point.x() + nx, point.y() + ny));\n                        extended_points.push(Point::new(point.x() - nx, point.y() - ny));\n                    }\n                }\n            }\n\n            bounding_box(\u0026extended_points)\n        } else {\n            // For paths without width, use the standard bounding box\n            let (bottom_left, bottom_right) = bounding_box(self.points());\n\n            (\n                to_database_float(bottom_left),\n                to_database_float(bottom_right),\n            )\n        }\n    }\n}\n","traces":[{"line":25,"address":[1668348,1668354,1668192],"length":1,"stats":{"Line":1}},{"line":27,"address":[],"length":0,"stats":{"Line":1}},{"line":28,"address":[1668216],"length":1,"stats":{"Line":1}},{"line":29,"address":[1668260],"length":1,"stats":{"Line":1}},{"line":38,"address":[1668368],"length":1,"stats":{"Line":1}},{"line":55,"address":[1149632],"length":1,"stats":{"Line":1}},{"line":56,"address":[1149637],"length":1,"stats":{"Line":1}},{"line":60,"address":[1668480],"length":1,"stats":{"Line":1}},{"line":61,"address":[1668485],"length":1,"stats":{"Line":1}},{"line":65,"address":[1668496],"length":1,"stats":{"Line":1}},{"line":66,"address":[],"length":0,"stats":{"Line":1}},{"line":70,"address":[1668512],"length":1,"stats":{"Line":1}},{"line":71,"address":[1668520],"length":1,"stats":{"Line":1}},{"line":75,"address":[3207696],"length":1,"stats":{"Line":1}},{"line":76,"address":[320 \n            layer: Default::default(),\n            data_type: Default::default(),\n        }\n    }\n}\n\nimpl\u003cDatabaseUnitT: CoordNum\u003e Polygon\u003cDatabaseUnitT\u003e {\n    #[must_use]\n    pub fn new(\n        points: impl IntoIterator\u003cItem = impl Into\u003cPoint\u003cDatabaseUnitT\u003e\u003e\u003e,\n        layer: Layer,\n        data_type: DataType,\n    ) -\u003e Self {\n        Self {\n            points: utils::get_correct_polygon_points_format(points),\n            layer,\n            data_type,\n        }\n    }\n\n    #[must_use]\n    pub fn points(\u0026self) -\u003e \u0026[Point\u003cDatabaseUnitT\u003e] {\n        \u0026self.points\n    }\n\n    #[must_use]\n    pub const fn layer(\u0026self) -\u003e Layer {\n        self.layer\n    }\n\n    #[must_use]\n    pub const fn data_type(\u0026self) -\u003e DataType {\n        self.data_type\n    }\n\n    #[must_use]\n    pub fn area(\u0026self) -\u003e DatabaseUnitT {\n        area(\u0026self.points)\n    }\n\n    #[must_use]\n    pub fn perimeter(\u0026self) -\u003e DatabaseUnitT {\n        perimeter(\u0026self.points)\n    }\n\n    pub fn is_point_inside(\u0026self, point: \u0026Point\u003cDatabaseUnitT\u003e) -\u003e bool {\n        is_point_inside(point, \u0026self.points)\n    }\n\n    pub fn is_point_on_edge(\u0026self, point: \u0026Point\u003cDatabaseUnitT\u003e) -\u003e bool {\n        is_point_on_edge(point, \u0026self.points)\n    }\n}\n\nimpl\u003cDatabaseUnitT: CoordNum\u003e std::fmt::Display for Polygon\u003cDatabaseUnitT\u003e {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter) -\u003e std::fmt::Result {\n        write!(\n            f,\n            \"Polygon with {} point(s), starting at ({:?}, {:?}) on layer {:?}, data type {:?}\",\n            self.points().len(),\n            self.points()[0].x(),\n            self.points()[0].y(),\n            self.layer(),\n            self.data_type()\n        )\n    }\n}\n\nimpl\u003cDatabaseUnitT: CoordNum\u003e Transformable for Polygon\u003cDatabaseUnitT\u003e {\n    fn transform_impl(\u0026self, transformation: \u0026Transformation) -\u003e Self {\n        let mut new_self = self.clone();\n        new_self.points = new_self\n            .points\n            .iter()\n            .map(|point| transformation.apply_to_point(point))\n            .collect();\n        new_self\n    }\n}\n\nimpl\u003cDatabaseUnitT: CoordNum\u003e Movable for Polygon\u003cDatabaseUnitT\u003e {\n    fn move_to(\u0026self, target: Point\u003cDatabaseIntegerUnit\u003e) -\u003e Self {\n        let first_point = \u0026self.points()[0];\n        let delta = Point::new(\n            DatabaseIntegerUnit::from_float(target.x().to_float() - first_point.x().to_float()),\n            DatabaseIntegerUnit::from_float(target.y().to_float() - first_point.y().to_float()),\n        );\n        self.move_by(delta)\n    }\n}\n\nimpl\u003cDatabaseUnitT: CoordNum\u003e Dimensions\u003cDatabaseUnitT\u003e for Polygon\u003cDatabaseUnitT\u003e {\n    fn bounding_box(\u0026self) -\u003e (Point\u003cDatabaseUnitT\u003e, Point\u003cDatabaseUnitT\u003e) {\n        bounding_box(self.points())\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use std::f64::consts::PI;\n\n    use super::*;\n    use crate::{\n        DatabaseIntegerUnit,\n        transformation::{Reflection, Rotation, Scale, Translation},\n    };\n\n    fn create_square() -\u003e Polygon\u003cDatabaseIntegerUnit\u003e {\n        let points = vec![\n            Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(0)),\n            Point::new(DatabaseIntegerUnit::from(10), DatabaseIntegerUnit::from(0)),\n            Point::new(DatabaseIntegerUnit::from(10), DatabaseIntegerUnit::from(10)),\n            Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(10)),\n        ];\n        Polygon::new(points, 1, 0)\n    }\n\n    fn create_triangle() -\u003e Polygon\u003cDatabaseIntegerUnit\u003e {\n        let points = vec![\n            Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(0)),\n            Point::new(DatabaseIntegerUnit::from(5), DatabaseIntegerUnit::from(10)),\n            Point::new(DatabaseIntegerUnit::from(5), DatabaseIntegerUnit::from(0)),\n            Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(0)),\n        ];\n        Polygon::new(points, 2, 1)\n    }\n\n    #[test]\n    fn test_default() {\n        let polygon: Polygon\u003cDatabaseIntegerUnit\u003e = Polygon::default();\n        assert_eq!(polygon.points().len(), 0);\n        assert_eq!(polygon.layer(), 0);\n        assert_eq!(polygon.data_type(), 0);\n    }\n\n    #[test]\n    fn test_new() {\n        let points = vec![\n            Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(0)),\n            Point::new(DatabaseIntegerUnit::from(5), DatabaseIntegerUnit::from(5)),\n        ];\n        let polygon = Polygon::new(points.clone(), 3, 2);\n\n        assert_eq!(polygon.layer(), 3);\n        assert_eq!(polygon.data_type(), 2);\n        assert_eq!(polygon.points().len(), 3);\n        assert_eq!(polygon.points()[0], points[0]);\n        assert_eq!(polygon.points()[1], points[1]);\n        assert_eq!(polygon.points()[2], points[0]); // Closed\n    }\n\n    #[test]\n    fn test_getters() {\n        let polygon = create_square();\n        assert_eq!(polygon.layer(), 1);\n        assert_eq!(polygon.data_type(), 0);\n        assert_eq!(polygon.points().len(), 5); // 4 + 1 to close\n    }\n\n    #[test]\n    fn test_area_square() {\n        let polygon = create_square();\n        let expected_area = DatabaseIntegerUnit::from(100); // 10 * 10\n        assert_eq!(polygon.area(), expected_area);\n    }\n\n    #[test]\n    fn test_area_triangle() {\n        let polygon = create_triangle();\n        let expected_area = DatabaseIntegerUnit::from(25); // 0.5 * base * height = 0.5 * 10 * 5\n        assert_eq!(polygon.area(), expected_area);\n    }\n\n    #[test]\n    fn test_perimeter_square() {\n        let polygon = create_square();\n        let expected_perimeter = DatabaseIntegerUnit::from(40); // 4 * 10\n        assert_eq!(polygon.perimeter(), expected_perimeter);\n    }\n\n    #[test]\n    fn test_is_point_inside() {\n        let polygon = create_square();\n\n        let inside_point = Point::new(DatabaseIntegerUnit::from(5), DatabaseIntegerUnit::from(5));\n        assert!(polygon.is_point_inside(\u0026inside_point));\n\n        let outside_point = Point::new(DatabaseIntegerUnit::from(15), DatabaseIntegerUnit::from(5));\n        assert!(!polygon.is_point_inside(\u0026outside_point));\n\n        let vertex_point = Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(0));\n        assert!(polygon.is_point_inside(\u0026vertex_point) || polygon.is_point_on_edge(\u0026vertex_point));\n    }\n\n    #[test]\n    fn test_is_point_on_edge() {\n        let polygon = create_square();\n\n        let edge_point = Point::new(DatabaseIntegerUnit::from(5), DatabaseIntegerUnit::from(0));\n        assert!(polygon.is_point_on_edge(\u0026edge_point));\n\n        let not_on_edge = Point::new(DatabaseIntegerUnit::from(5), DatabaseIntegerUnit::from(5));\n        assert!(!polygon.is_point_on_edge(\u0026not_on_edge));\n\n        let vertex_point = Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(0));\n        assert!(polygon.is_point_on_edge(\u0026vertex_point));\n    }\n\n    #[test]\n    fn test_display() {\n        let polygon = create_square();\n        let display_str = format!(\"{polygon}\");\n        assert!(display_str.contains(\"Polygon with 5 point(s)\"));\n        assert!(display_str.contains(\"starting at (0, 0)\"));\n        assert!(display_str.contains(\"layer 1\"));\n        assert!(display_str.contains(\"data type 0\"));\n    }\n\n    #[test]\n    fn test_clone() {\n        let polygon = create_square();\n        let cloned = polygon.clone();\n        assert_eq!(polygon.points(), cloned.points());\n        assert_eq!(polygon.layer(), cloned.layer());\n        assert_eq!(polygon.data_type(), cloned.data_type());\n    }\n\n    #[test]\n    fn test_partial_eq() {\n        let polygon1 = create_square();\n        let polygon2 = create_square();\n        let polygon3 = create_triangle();\n\n        assert_eq!(polygon1, polygon2);\n        assert_ne!(polygon1, polygon3);\n    }\n\n    #[test]\n    fn test_transformable_translation() {\n        let polygon = create_square();\n        let translation = Translation::new(Point::new(\n            DatabaseIntegerUnit::from(5),\n            DatabaseIntegerUnit::from(3),\n        ));\n\n        let transformed = polygon.transform(translation);\n\n        assert_eq!(transformed.points()[0].x(), DatabaseIntegerUnit::from(5));\n        assert_eq!(transformed.points()[0].y(), DatabaseIntegerUnit::from(3));\n    }\n\n    #[test]\n    fn test_transformable_rotation() {\n        let polygon = create_square();\n        let rotation = Rotation::new(PI / 2.0, Point::new(0, 0));\n\n        let transformed = polygon.transform(rotation);\n\n        assert_eq!(transformed.points().len(), polygon.points().len());\n        assert_eq!(transformed.area(), polygon.area());\n    }\n\n    #[test]\n    fn test_transformable_scale() {\n        let polygon = create_square();\n        let scale = Scale::new(\n            2.0,\n            Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(0)),\n        );\n\n        let transformed = polygon.transform(scale);\n\n        assert_eq!(\n            transformed.area(),\n            polygon.area() * DatabaseIntegerUnit::from(4)\n        );\n    }\n\n    #[test]\n    fn test_transformable_reflection() {\n        let polygon = create_square();\n        let reflection = Reflection::new_horizontal();\n\n        let transformed = polygon.transform(reflection);\n\n        assert_eq!(transformed.area(), polygon.area());\n        assert_eq!(transformed.points().len(), polygon.points().len());\n    }\n\n    #[test]\n    fn test_movable_move_to() {\n        let polygon = create_square();\n        let target = Point::new(\n            DatabaseIntegerUnit::from(100),\n            DatabaseIntegerUnit::from(200),\n        );\n\n        let moved = polygon.move_to(target);\n\n        assert_eq!(moved.points()[0].x(), DatabaseIntegerUnit::from(100));\n        assert_eq!(moved.points()[0].y(), DatabaseIntegerUnit::from(200));\n\n        assert_eq!(moved.area(), polygon.area());\n    }\n\n    #[test]\n    fn test_dimensions_bounding_box() {\n        let polygon = create_square();\n        let (min_point, max_point) = polygon.bounding_box();\n\n        assert_eq!(min_point.x(), DatabaseIntegerUnit::from(0));\n        assert_eq!(min_point.y(), DatabaseIntegerUnit::from(0));\n        assert_eq!(max_point.x(), DatabaseIntegerUnit::from(10));\n        assert_eq!(max_point.y(), DatabaseIntegerUnit::from(10));\n    }\n\n    #[test]\n    fn test_empty_polygon() {\n        let empty_points: Vec\u003cPoint\u003cDatabaseIntegerUnit\u003e\u003e = vec![];\n        let polygon = Polygon::new(empty_points, 0, 0);\n\n        assert_eq!(polygon.points().len(), 0);\n        assert_eq!(polygon.area(), DatabaseIntegerUnit::from(0));\n    }\n\n    #[test]\n    fn test_single_point_polygon() {\n        let single_point = vec![Point::new(\n            DatabaseIntegerUnit::from(5),\n            DatabaseIntegerUnit::from(5),\n        )];\n        let polygon = Polygon::new(single_point, 0, 0);\n\n        assert_eq!(polygon.points().len(), 1);\n        assert_eq!(polygon.area(), DatabaseIntegerUnit::from(0));\n    }\n\n    #[test]\n    fn test_already_closed_polygon() {\n        let points = vec![\n            Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(0)),\n            Point::new(DatabaseIntegerUnit::from(5), DatabaseIntegerUnit::from(0)),\n            Point::new(DatabaseIntegerUnit::from(5), DatabaseIntegerUnit::from(5)),\n            Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(0)),\n egerUnit::from(1), DatabaseIntegerUnit::from(0)),\n            Point::new(DatabaseIntegerUnit::from(1), DatabaseIntegerUnit::from(1)),\n            Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(1)), // Different from first\n        ];\n        assert!(!are_points_closed(\u0026points));\n    }\n\n    #[test]\n    fn test_are_points_closed_single_point() {\n        let points = vec![Point::new(\n            DatabaseIntegerUnit::from(5),\n            DatabaseIntegerUnit::from(5),\n        )];\n        // Single point is considered closed (first == last)\n        assert!(are_points_closed(\u0026points));\n    }\n\n    #[test]\n    fn test_are_points_closed_two_same_points() {\n        let points = vec![\n            Point::new(DatabaseIntegerUnit::from(3), DatabaseIntegerUnit::from(4)),\n            Point::new(DatabaseIntegerUnit::from(3), DatabaseIntegerUnit::from(4)),\n        ];\n        assert!(are_points_closed(\u0026points));\n    }\n\n    #[test]\n    fn test_are_points_closed_empty() {\n        let points: Vec\u003cPoint\u003cDatabaseIntegerUnit\u003e\u003e = vec![];\n        // Empty vector: first() and last() both return None, so None == None is true\n        assert!(are_points_closed(\u0026points));\n    }\n\n    #[test]\n    fn test_close_points_already_closed() {\n        let points = vec![\n            Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(0)),\n            Point::new(DatabaseIntegerUnit::from(5), DatabaseIntegerUnit::from(0)),\n            Point::new(DatabaseIntegerUnit::from(5), DatabaseIntegerUnit::from(5)),\n            Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(0)), // Already closed\n        ];\n        let closed = close_points(points.clone());\n\n        // Should return same points since already closed\n        assert_eq!(closed.len(), points.len());\n        assert_eq!(closed, points);\n    }\n\n    #[test]\n    fn test_close_points_not_closed() {\n        let points = vec![\n            Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(0)),\n            Point::new(DatabaseIntegerUnit::from(5), DatabaseIntegerUnit::from(0)),\n            Point::new(DatabaseIntegerUnit::from(5), DatabaseIntegerUnit::from(5)),\n            Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(5)), // Not closed\n        ];\n        let closed = close_points(points.clone());\n\n        // Should add closing point\n        assert_eq!(closed.len(), points.len() + 1);\n        assert_eq!(closed[0], points[0]); // First point\n        assert_eq!(closed[closed.len() - 1], points[0]); // Last point should match first\n\n        // All original points should be preserved\n        for (i, original_point) in points.iter().enumerate() {\n            assert_eq!(closed[i], *original_point);\n        }\n    }\n\n    #[test]\n    fn test_close_points_single_point() {\n        let points = vec![Point::new(\n            DatabaseIntegerUnit::from(7),\n            DatabaseIntegerUnit::from(3),\n        )];\n        let closed = close_points(points.clone());\n\n        // Single point is already \"closed\", should return unchanged\n        assert_eq!(closed.len(), 1);\n        assert_eq!(closed, points);\n    }\n\n    #[test]\n    fn test_close_points_two_different_points() {\n        let points = vec![\n            Point::new(DatabaseIntegerUnit::from(1), DatabaseIntegerUnit::from(2)),\n            Point::new(DatabaseIntegerUnit::from(3), DatabaseIntegerUnit::from(4)),\n        ];\n        let closed = close_points(points.clone());\n\n        // Should add closing point\n        assert_eq!(closed.len(), 3);\n        assert_eq!(closed[0], points[0]);\n        assert_eq!(closed[1], points[1]);\n        assert_eq!(closed[2], points[0]); // Closing point\n    }\n\n    #[test]\n    fn test_close_points_empty() {\n        let points: Vec\u003cPoint\u003cDatabaseIntegerUnit\u003e\u003e = vec![];\n        let closed = close_points(points.clone());\n\n        // Empty should remain empty\n        assert_eq!(closed.len(), 0);\n        assert_eq!(closed, points);\n    }\n\n    #[test]\n    fn test_get_correct_polygon_points_format_open() {\n        let points = vec![\n            Point::new(DatabaseIntegerUnit::from(10), DatabaseIntegerUnit::from(20)),\n            Point::new(DatabaseIntegerUnit::from(30), DatabaseIntegerUnit::from(20)),\n            Point::new(DatabaseIntegerUnit::from(30), DatabaseIntegerUnit::from(40)),\n        ];\n        let formatted = get_correct_polygon_points_format(points.clone());\n\n        // Should close the polygon\n        assert_eq!(formatted.len(), points.len() + 1);\n        assert_eq!(formatted[0], points[0]);\n        assert_eq!(formatted[formatted.len() - 1], points[0]);\n    }\n\n    #[test]\n    fn test_get_correct_polygon_points_format_closed() {\n        let points = vec![\n            Point::new(DatabaseIntegerUnit::from(10), DatabaseIntegerUnit::from(20)),\n            Point::new(DatabaseIntegerUnit::from(30), DatabaseIntegerUnit::from(20)),\n            Point::new(DatabaseIntegerUnit::from(30), DatabaseIntegerUnit::from(40)),\n            Point::new(DatabaseIntegerUnit::from(10), DatabaseIntegerUnit::from(20)), // Already closed\n        ];\n        let formatted = get_correct_polygon_points_format(points.clone());\n\n        // Should remain unchanged\n        assert_eq!(formatted.len(), points.len());\n        assert_eq!(formatted, points);\n    }\n\n    #[test]\n    fn test_get_correct_polygon_points_format_empty() {\n        let points: Vec\u003cPoint\u003cDatabaseIntegerUnit\u003e\u003e = vec![];\n        let formatted = get_correct_polygon_points_format(points.clone());\n\n        // Empty should remain empty\n        assert_eq!(formatted.len(), 0);\n        assert_eq!(formatted, points);\n    }\n\n    #[test]\n    fn test_get_correct_polygon_points_format_single() {\n        let points = vec![Point::new(\n            DatabaseIntegerUnit::from(100),\n th_element(file, scale, element.as_ref().as_ref())\n            }\n        }\n    }\n}\n\nimpl\u003cDatabaseUnitT: CoordNum\u003e Reference\u003cDatabaseUnitT\u003e {\n    fn to_gds_impl_with_element(\n        \u0026self,\n        file: \u0026mut File,\n        scale: f64,\n        element: \u0026Element\u003cDatabaseUnitT\u003e,\n    ) -\u003e io::Result\u003c()\u003e {\n        for element in self.get_elements_in_grid(element) {\n            element.to_gds_impl(file, scale)?;\n        }\n\n        Ok(())\n    }\n\n    fn to_gds_impl_with_cell(\n        \u0026self,\n        file: \u0026mut File,\n        scale: f64,\n        cell_name: \u0026str,\n    ) -\u003e io::Result\u003c()\u003e {\n        let buffer_start = [\n            4,\n            combine_record_and_data_type(GDSRecord::ARef, GDSDataType::NoData),\n        ];\n\n        write_u16_array_to_file(file, \u0026buffer_start)?;\n\n        write_string_with_record_to_file(file, GDSRecord::SName, cell_name)?;\n\n        write_transformation_to_file(\n            file,\n            self.grid.angle,\n            self.grid.magnification,\n            self.grid.x_reflection,\n        )?;\n\n        let buffer_array = [\n            8,\n            combine_record_and_data_type(GDSRecord::ColRow, GDSDataType::TwoByteSignedInteger),\n            self.grid.columns as u16,\n            self.grid.rows as u16,\n        ];\n\n        write_u16_array_to_file(file, \u0026buffer_array)?;\n\n        let origin = point_to_database_float(self.grid.origin);\n        let point2 = point_to_database_float(self.grid.origin + self.grid.spacing_x)\n            * f64::from(self.grid.columns);\n        let point3 = point_to_database_float(self.grid.origin + self.grid.spacing_y)\n            * f64::from(self.grid.rows);\n\n        let reference_points: Vec\u003c_\u003e = [origin, point2, point3]\n            .iter()\n            .map(|\u0026p| p.rotate_around_point(self.grid.angle, origin))\n            .collect();\n\n        write_poin                   elements.extend(self.get_elements_in_grid(cell_element));\n                }\n            }\n            Instance::Element(element) =\u003e match element.as_ref().as_ref() {\n                Element::Path(_) | Element::Polygon(_) | Element::Text(_) =\u003e {\n                    elements.extend(self.get_elements_in_grid(element));\n                }\n\n                Element::Reference(reference) =\u003e {\n                    let flattened_reference_elements = reference.clone().flatten(Some(depth - 1));\n\n                    for reference_element in flattened_reference_elements {\n                        elements.extend(self.get_elements_in_grid(\u0026reference_element).into_iter());\n                    }\n                }\n            },\n        }\n\n        elements\n    }\n}\n\nimpl\u003cDatabaseUnitT: CoordNum\u003e Transformable for Reference\u003cDatabaseUnitT\u003e {\n    fn transform_impl(\u0026self, transformation: \u0026Transformation) -\u003e Self {\n        let mut new_self = self.clone();\n        new_self.grid = new_self.grid.transform_impl(transformation);\n        new_self\n    }\n}\n\nimpl\u003cDatabaseUnitT: CoordNum\u003e Movable for Reference\u003cDatabaseUnitT\u003e {\n    fn move_to(\u0026self, target: Point\u003cDatabaseIntegerUnit\u003e) -\u003e Self {\n        let mut new_self = self.clone();\n        new_self.grid = new_self.grid.move_to(target);\n        new_self\n    }\n}\n\n// impl\u003cT: CoordNum\u003e Dimensions\u003cT\u003e for Reference\u003cT\u003e {\n//     fn bounding_box(\u0026self) -\u003e (Point\u003cT\u003e, Point\u003cT\u003e) {\n//         let mut min_x = f64::INFINITY;\n//         let mut min_y = f64::INFINITY;\n//         let mut max_x = f64::NEG_INFINITY;\n//         let mut max_y = f64::NEG_INFINITY;\n\n//         let grid = \u0026self.grid;\n\n//         let corners = vec![\n//             grid.origin,\n//             grid.origin + grid.spacing_x * (grid.columns as f64).into(),\n//             g            x: p.x().to_float(),\n            y: p.y().to_float(),\n        })\n        .collect()\n}\n\n/// Calculate the bounding box of a collection of points\n/// Returns (`min_point`, `max_point`) representing the bottom-left and top-right corners\npub fn bounding_box\u003cT: CoordNum\u003e(points: \u0026[Point\u003cT\u003e]) -\u003e (Point\u003cT\u003e, Point\u003cT\u003e) {\n    if points.is_empty() {\n        return (\n            Point::new(T::zero(), T::zero()),\n            Point::new(T::zero(), T::zero()),\n        );\n    }\n\n    // Use geo's BoundingRect trait for robust calculation\n    let multipoint = geo::MultiPoint::new(points.to_vec());\n    multipoint.bounding_rect().map_or_else(\n        || {\n            let first = points[0];\n            (first, first)\n        },\n        |rect| {\n            let min_point = Point::new(rect.min().x, rect.min().y);\n            let max_point = Point::new(rect.max().x, rect.max().y);\n            (min_point, max_point)\n        },\n    )\n}\n\n/// Calculate the area of a polygon defined by points using the shoelace formula\n/// Points should be in order (clockwise or counter-clockwise)\npub fn area\u003cDatabaseUnitT: CoordNum\u003e(points: \u0026[Point\u003cDatabaseUnitT\u003e]) -\u003e DatabaseUnitT {\n    if points.len() \u003c 3 {\n        return DatabaseUnitT::zero();\n    }\n\n    let coords = to_float_coords(points);\n\n    // Close the polygon by adding the first point at the end if not already closed\n    let mut closed_coords = coords;\n    if let (Some(first), Some(last)) = (closed_coords.first(), closed_coords.last()) {\n        if first != last {\n            closed_coords.push(*first);\n        }\n    }\n\n    let linestring = LineString::new(closed_coords);\n    let polygon = Polygon::new(linestring, vec![]);\n\n    DatabaseUnitT::from_float(polygon.unsigned_area().abs())\n}\n\n/// Calculate the perimeter of a polygon defined by points\n/// For open polygons, calculates the total length of all segments\n/// For closed polygons, includes the segment from last to first point\npub fn perimeter\u003cDatabaseUnitT: CoordNum\u003e(points: \u0026[Point\u003cDatabaseUnitT\u003e]) -\u003e DatabaseUnitT {\n    if points.len() \u003c 2 {\n        return DatabaseUnitT::zero();\n    }\n\n    let coords = to_float_coords(points);\n\n    let linestring = LineString::new(coords);\n\n    DatabaseUnitT::from_float(linestring.euclidean_length())\n}\n\n/// Check if a point is inside a polygon using the ray casting algorithm\n/// The polygon is defined by an ordered list of points\npub fn is_point_inside\u003cDatabaseUnitT: CoordNum\u003e(\n    point: \u0026Point\u003cDatabaseUnitT\u003e,\n    polygon_points: \u0026[Point\u003cDatabaseUnitT\u003e],\n) -\u003e bool {\n    if polygon_points.len() \u003c 3 {\n        return false;\n    }\n\n    let coords = to_float_coords(polygon_points);\n\n    // Ensure the polygon is closed\n    let mut closed_coords = coords;\n    if let (Some(first), Some(last)) = (closed_coords.first(), closed_coords.last()) {\n        if first != last {\n            closed_coords.push(*first);\n        }\n    }\n\n    let linestring = LineString::new(closed_coords);\n    let polygon = Polygon::new(linestring, vec![]);\n\n    polygon.contains(\u0026point_to_database_float(*point))\n}\n\n/// Check if a point lies on the edge of a polygon\npub fn is_point_on_edge\u003cT: CoordNum\u003e(point: \u0026Point\u003cT\u003e, polygon_points: \u0026[Point\u003cT\u003e]) -\u003e bool {\n    if polygon_points.len() \u003c 2 {\n        return false;\n    }\n\n    let num_points = polygon_points.len();\n    for i in 0..num_points {\n        let start = \u0026polygon_points[i];\n        let end = \u0026polygon_points[(i + 1) % num_points];\n\n        if is_point_on_line_segment(point, start, end) {\n            return true;\n        }\n    }\n    false\n}\n\n/// Check if a point lies on a line segment\npub fn is_point_on_line_segment\u003cT: CoordNum\u003e(point: \u0026Point\u003cT\u003e, a: \u0026Point\u003cT\u003e, b: \u0026Point\u003cT\u003e) -\u003e bool {\n    let line_segment = Line::new(\n        Coord {\n            x: a.x().to_float(),\n            y: a.y().to_float(),\n        },\n        Coord {\n            x: b.x().to_float(),\n            y: b.y().to_float(),\n        },\n    );\n    line_segment.contains(\u0026point_to_database_float(*point))\n}\n\n/// Round a floating point value to a specified number of decimal places\npub fn round_to_decimals(value: f64, ndigits: u32) -\u003e f64 {\n    let factor = 10f64.powi(ndigits as i32);\n    (value * factor).round() / factor\n}\n\n#[cfg(test)]\nmod tests {\n    use approx::assert_relative_eq;\n\n    use super::*;\n\n    #[test]\n    fn test_bounding_box() {\n        let points = vec![\n            Point::new(1.0, 2.0),\n            Point::new(4.0, 6.0),\n            Point::new(-1.0, 3.0),\n            Point::new(2.0, -1.0),\n        ];\n\n        let (min_point, max_point) = bounding_box(\u0026points);\n        assert_eq!(min_point, Point::new(-1.0, -1.0));\n        assert_eq!(max_point, Point::new(4.0, 6.0));\n    }\n\n    #[test]\n    fn test_area() {\n        // Square with side length 2\n        let square = vec![\n            Point::new(0.0, 0.0),\n            Point::new(2.0, 0.0),\n            Point::new(2.0, 2.0),\n            Point::new(0.0, 2.0),\n        ];\n\n        let area_result = area(\u0026square);\n        assert_relative_eq!(area_result, 4.0, epsilon = 1e-10);\n    }\n\n    #[test]\n    fn test_point_inside() {\n        let square = vec![\n            Point::new(0.0, 0.0),\n            Point::new(2.0, 0.0),\n            Point::new(2.0, 2.0),\n            Point::new(0.0, 2.0),\n        ];\n\n        assert!(is_point_inside(\u0026Point::new(1.0, 1.0), \u0026square));\n        assert!(!is_point_inside(\u0026Point::new(3.0, 3.0), \u0026square));\n    }\n\n    #[test]\n    fn test_point_on_edge() {\n        let triangle = vec![\n            Point::new(0.0, 0.0),\n            Point::new(2.0, 0.0),\n            Point::new(1.0, 2.0),\n        ];\n\n        assert!(is_point_on_edge(\u0026Point::new(1.0, 0.0), \u0026triangle));\n        assert!(!is_point_on_edge(\u0026Point::new(1.0, 1.0), \u0026triangle));\n    }\n}\n","traces":[{"line":5,"address":[1160976,1161072],"length":1,"stats":{"Line":3}},{"line":8,"address":[],"length":0,"stats":{"Line":0}},{"line":10,"address":[],"length":0,"stats":{"Line":6}},{"line":11,"address":[],"length":0,"stats":{"Line":3}},{"line":12,"address":[],"length":0,"stats":{"Line":5}},{"line":19,"address":[3228883,3228889,3229264,3228528,3228912,3229258],"length":1,"stats":{"Line":2}},{"line":20,"address":[1161803,1161451],"length":1,"stats":{"Line":2}},{"line":21,"address":[3229145,3228766],"length":1,"stats":{"Line":0}},{"line":22,"address":[3228677,3229061],"length":1,"stats":{"Line":0}},{"line":23,"address":[3229098,3228718],"length":1,"stats":{"Line":0}},{"line":28,"address":[3228991,3228607],"length":1,"stats":{"Line":2}},{"line":29,"address":[1161870,1162036,1161518,1161695],"length":1,"stats":{"Line":4}},{"line":30,"address":[1162096,1162224],"length":1,"stats":{"Line":0}},{"line":31,"address":[3229442,3229378,3229514,3229314],"length":1,"stats":{"Line":0}},{"line":32,"address":[3229485,3229353],"length":1,"stats":{"Line":0}},{"line":34,"address":[1162352,1162736],"length":1,"stats":{"Line":2}},{"line":35,"address":[1162374,1162758],"length":1,"stats":{"Line":2}},{"line":36,"address":[3230095,3229708],"length":1,"stats":{"Line":2}},{"line":37,"address":[3230280,3229893],"length":1,"stats":{"Line":2}},{"line":44,"address":[1164888,1164916,1163120,1163971,1163999,1164032],"length":1,"stats":{"Line":2}},{"line":45,"address":[1164065,1163153],"length":1,"stats":{"Line":2}},{"line":46,"address":[],"length":0,"stats":{"Line":1}},{"line":49,"address":[],"length":0,"stats":{"Line":2}},{"line":52,"address":[],"length":0,"stats":{"Line":2}},{"line":53,"address":[1163324,1164141,1163550,1163229,11642 h":1,"stats":{"Line":2}},{"line":127,"address":[],"length":0,"stats":{"Line":0}},{"line":128,"address":[],"length":0,"stats":{"Line":2}},{"line":129,"address":[],"length":0,"stats":{"Line":2}},{"line":131,"address":[],"length":0,"stats":{"Line":0}},{"line":132,"address":[],"length":0,"stats":{"Line":2}},{"line":133,"address":[],"length":0,"stats":{"Line":3}},{"line":136,"address":[],"length":0,"stats":{"Line":3}},{"line":140,"address":[3205952],"length":1,"stats":{"Line":1}},{"line":141,"address":[3205971],"length":1,"stats":{"Line":1}},{"line":142,"address":[3206004],"length":1,"stats":{"Line":1}}],"covered":56,"coverable":68},{"path":["/","home","matthew","develop","personal","gdsr","crates","gdsr_core","src","utils","io.rs"],"content":"use std::{\n    collections::HashSet,\n    convert::TryFrom,\n    fs::File,\n    io::{self, BufReader, Read, Write},\n};\n\nuse bytemuck::cast_slice;\nuse chrono::{Datelike, Local, Timelike};\nuse geo::Rotate;\n\nuse crate::{\n    CoordNum, DataType, DatabaseIntegerUnit, Layer, Point,\n    cell::Cell,\n    config::gds_file_types::{GDSDataType, GDSRecord, GDSRecordData, combine_record_and_data_type},\n    elements::{\n        Instance, Path, PathType, Polygon, Reference, Text,\n        text::utils::get_presentations_from_value,\n    },\n    library::Library,\n    utils::{\n        gds_format::{eight_byte_real, u16_array_to_big_endian},\n        general::{point_to_database_float, point_to_database_unit},\n        geometry::round_to_decimals,\n    },\n};\n\npub fn write_gds_head_to_file(\n    library_name: \u0026str,\n    user_units: f64,\n    database_units: f64,\n    file: \u0026mut File,\n) -\u003e io::Result\u003c()\u003e {\n    let now = Local::now();\n    let timestamp = now.naive_utc();\n\n    let head_start = [\n        6,\n        combine_record_and_data_type(GDSRecord::Header, GDSDataType::TwoByteSignedInteger),\n        0x0258,\n        28,\n        combine_record_and_data_type(GDSRecord::BgnLib, GDSDataType::TwoByteSignedInteger),\n        timestamp.year() as u16,\n        timestamp.month() as u16,\n        timestamp.day() as u16,\n        timestamp.hour() as u16,\n        timestamp.minute() as u16,\n        timestamp.second() as u16,\n        timestamp.year() as u16,\n        timestamp.month() as u16,\n        timestamp.day() as u16,\n        timestamp.hour() as u16,\n        timestamp.minute() as u16,\n        timestamp.second() as u16,\n    ];\n\n    write_u16_array_to_file(file, \u0026head_start)?;\n\n    write_string_with_record_to_file(file, GDSRecord::LibName, library_name)?;\n\n    let head_units = [\n        20,\n        combine_record_and_data_type(GDSRecord::Units, GDSDataType::EightByteReal),\n    ];\n    write_u16_array_to_file(file, \u0026head_units)?;\n\n    write_float_to_eight_byte_real_to_file(file, user_units)?;\n    write_float_to_eight_byte_real_to_file(file, database_units)\n}\n\npub fn write_gds_tail_to_file(file: \u0026mut File) -\u003e io::Result\u003c()\u003e {\n    let tail = [\n        4,\n        combine_record_and_data_type(GDSRecord::EndLib, GDSDataType::NoData),\n    ];\n    write_u16_array_to_file(file, \u0026tail)\n}\n\npub fn write_u16_array_to_file(file: \u0026mut File, array: \u0026[u16]) -\u003e io::Result\u003c()\u003e {\n    let u16_array_to_big_endian = u16_array_to_big_endian(array);\n    file.write_all(cast_slice(\u0026u16_array_to_big_endian))\n}\n\npub fn write_float_to_eight_byte_real_to_file(file: \u0026mut File, value: f64) -\u003e io::Result\u003c()\u003e {\n    let value = eight_byte_real(value);\n    file.write_all(\u0026value)\n}\n\npub fn write_points_to_file\u003cDatabaseUnitT: CoordNum\u003e(\n    file: \u0026mut File,\n    points: \u0026[Point\u003cDatabaseUnitT\u003e],\n    scale: f64,\n    to_integer: \u0026dyn Fn(DatabaseUnitT) -\u003e DatabaseIntegerUnit,\n) -\u003e io::Result\u003c()\u003e {\n    let new_points: Vec\u003cPoint\u003cDatabaseIntegerUnit\u003e\u003e = points\n        .iter()\n        .map(|point| Point::new(to s: f64,\n    database_units: f64,\n    cells: impl Iterator\u003cItem = \u0026'a Cell\u003cT\u003e\u003e,\n) -\u003e io::Result\u003c()\u003e {\n    let mut file = File::create(file_name)?;\n\n    write_gds_head_to_file(library_name, user_units, database_units, \u0026mut file)?;\n\n    let mut written_cell_names: HashSet\u003cString\u003e = HashSet::new();\n\n    for cell in cells {\n        if !written_cell_names.contains(\u0026cell.name) {\n            written_cell_names.insert(cell.name.clone());\n            cell.to_gds_impl(\n                \u0026mut file,\n                user_units,\n                database_units,\n                \u0026mut written_cell_names,\n            )?;\n        }\n    }\n\n    write_gds_tail_to_file(\u0026mut file)?;\n\n    file.flush()\n}\n\npub fn write_transformation_to_file(\n    file: \u0026mut File,\n    angle: f64,\n    magnification: f64,\n    x_reflection: bool,\n) -\u003e io::Result\u003c()\u003e {\n    let transform_applied = angle != 0.0 || magnification != 1.0 || x_reflection;\n    if transform_applied {\n        let buffer_flags = [\n            6,\n            combine_record_and_data_type(GDSRecord::STrans, GDSDataType::BitArray),\n            if x_reflection { 0x8000 } else { 0x0000 },\n        ];\n\n        write_u16_array_to_file(file, \u0026buffer_flags)?;\n\n        if magnification != 1.0 {\n            let buffer_mag = [\n                12,\n                combine_record_and_data_type(GDSRecord::Mag, GDSDataType::EightByteReal),\n            ];\n            write_u16_array_to_file(file, \u0026buffer_mag)?;\n            write_float_to_eight_byte_real_to_file(file, magnification)?;\n        }\n\n        if angle != 0.0 {\n            let buffer_rot = [\n                12,\n                combine_record_and_data_type(GDSRecord::Angle, GDSDataType::EightByteReal),\n            ];\n            write_u16_array_to_file(file, \u0026buffer_rot)?;\n            write_float_to_eight_byte_real_to_file(file, angle)?;\n        }\n    }\n\n    Ok(())\n}\n\n#[allow(clippy::too_many_lines, clippy::cognitive_complexity)]\npub fn from_gds\u003cDatabaseUnitT: CoordNum\u003e(file_name: String) -\u003e io::Result\u003cLibrary\u003cDatabaseUnitT\u003e\u003e {\n    let mut library = Library::new(\"Library\");\n\n    let file = File::open(file_name)?;\n    let reader = RecordReader::new(BufReader::new(file));\n\n    let mut cell: Option\u003cCell\u003cDatabaseUnitT\u003e\u003e = None;\n    let mut path: Option\u003cPath\u003cDatabaseUnitT\u003e\u003e = None;\n    let mut polygon: Option\u003cPolygon\u003cDatabaseUnitT\u003e\u003e = None;\n    let mut text: Option\u003cText\u003cDatabaseUnitT\u003e\u003e = None;\n    let mut reference: Option\u003cReference\u003cDatabaseUnitT\u003e\u003e = None;\n\n    let mut scale = 1.0;\n\n    for record in reader {\n        match record {\n            Ok((record_type, data)) =\u003e match record_type {\n                GDSRecord::LibName =\u003e {\n                    if let GDSRecordData::Str(name) = data {\n                        library.name = name;\n                    }\n                }\n                GDSRecord::Units =\u003e {\n                    if let GDSRecordData::F64(units) = data {\n                        scale = units[1] / units[0];\n                    }\n                }\n                GDSRecord::EndLib =\u003e {\n                    update_references(\u0026mut library);\n                }\n                GDSRecord::BgnStr =\u003e {\n                    cell = Some(Cell::default());\n                }\n                GDSRecord::StrName =\u003e {\n                    if let GDSRecordData::Str(cell_name) = data {\n                        if let Some(cell) = \u0026mut cell {\n                            cell.name = cell_name;\n                        }\n                    }\n                }\n                GDSRecord::EndStr =\u003e {\n                    if let Some(cell) = cell.take() {\n                        library.cells.ins ult(),\n            data_type: Default::default(),\n        }\n    }\n}\n\nimpl\u003cDatabaseUnitT: CoordNum\u003e Polygon\u003cDatabaseUnitT\u003e {\n    #[must_use]\n    pub fn new(\n        points: impl IntoIterator\u003cItem = impl Into\u003cPoint\u003cDatabaseUnitT\u003e\u003e\u003e,\n        layer: Layer,\n        data_type: DataType,\n    ) -\u003e Self {\n        Self {\n            points: utils::get_correct_polygon_points_format(points),\n            layer,\n            data_type,\n        }\n    }\n\n    #[must_use]\n    pub fn points(\u0026self) -\u003e \u0026[Point\u003cDatabaseUnitT\u003e] {\n        \u0026self.points\n    }\n\n    #[must_use]\n    pub const fn layer(\u0026self) -\u003e Layer {\n        self.layer\n    }\n\n    #[must_use]\n    pub const fn data_type(\u0026self) -\u003e DataType {\n        self.data_type\n    }\n\n    #[must_use]\n    pub fn area(\u0026self) -\u003e DatabaseUnitT {\n        area(\u0026self.points)\n    }\n\n    #[must_use]\n    pub fn perimeter(\u0026self) -\u003e DatabaseUnitT {\n        perimeter(\u0026self.points)\n    }\n\n    pub fn is_point_inside(\u0026self, point: \u0026Point\u003cDatabaseUnitT\u003e) -\u003e bool {\n        is_point_inside(point, \u0026self.points)\n    }\n\n    pub fn is_point_on_edge(\u0026self, point: \u0026Point\u003cDatabaseUnitT\u003e) -\u003e bool {\n        is_point_on_edge(point, \u0026self.points)\n    }\n}\n\nimpl\u003cDatabaseUnitT: CoordNum\u003e std::fmt::Display for Polygon\u003cDatabaseUnitT\u003e {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter) -\u003e std::fmt::Result {\n        write!(\n            f,\n            \"Polygon with {} point(s), starting at ({:?}, {:?}) on layer {:?}, data type {:?}\",\n            self.points().len(),\n            self.points()[0].x(),\n            self.points()[0].y(),\n            self.layer(),\n            self.data_type()\n        )\n    }\n}\n\nimpl\u003cDatabaseUnitT: CoordNum\u003e Transformable for Polygon\u003cDatabaseUnitT\u003e {\n    fn transform_impl(\u0026self, transformation: \u0026Transformation) -\u003e Self {\n        let mut new_self = self.clone();\n        new_self.points = new_self\n            .points\n            .iter()\n            .map(|point| transformation.apply_to_point(point))\n            .collect();\n        new_self\n    }\n}\n\nimpl\u003cDatabaseUnitT: CoordNum\u003e Movable for Polygon\u003cDatabaseUnitT\u003e {\n    fn move_to(\u0026self, target: Point\u003cDatabaseIntegerUnit\u003e) -\u003e Self {\n        let first_point = \u0026self.points()[0];\n        let delta = Point::new(\n            DatabaseIntegerUnit::from_float(target.x().to_float() - first_point.x().to_float()),\n            DatabaseIntegerUnit::from_float(target.y().to_float() - first_point.y().to_float()),\n        );\n        self.move_by(delta)\n    }\n}\n\nimpl\u003cDatabaseUnitT: CoordNum\u003e Dimensions\u003cDatabaseUnitT\u003e for Polygon\u003cDatabaseUnitT\u003e {\n    fn bounding_box(\u0026self) -\u003e (Point\u003cDatabaseUnitT\u003e, Point\u003cDatabaseUnitT\u003e) {\n        bounding_box(self.points())\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use std::f64::consts::PI;\n\n    use super::*;\n    use crate::{\n        DatabaseIntegerUnit,\n        transformation::{Reflection, Rotation, Scale, Translation},\n    };\n\n    fn create_square() -\u003e Polygon\u003cDatabaseIntegerUnit\u003e {\n        let points = vec![\n            Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(0)),\n            Point::new(DatabaseIntegerUnit::from(10), DatabaseIntegerUnit::from(0)),\n            Point::new(DatabaseIntegerUnit::from(10), DatabaseIntegerUnit::from(10)),\n            Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(10)),\n        ];\n        Polygon::new(points, 1, 0)\n    }\n\n    fn create_triangle() -\u003e Polygon\u003cDatabaseIntegerUnit\u003e {\n        let points = vec![\n            Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(0)),\n            Point::new(DatabaseIntegerUnit::from(5), DatabaseIntegerUnit::from(10)),\n            Point::new(DatabaseIntegerUnit::from(5), DatabaseIntegerUnit::from(0)),\n            Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(0)),\n        ];\n        Polygon::new(points, 2, 1)\n    }\n\n    #[test]\n    fn test_default() {\n        let polygon: Polygon\u003cDatabaseIntegerUnit\u003e = Polygon::default();\n        assert_eq!(polygon.points().len(), 0);\n        assert_eq!(polygon.layer(), 0);\n        assert_eq!(polygon.data_type(), 0);\n    }\n\n    #[test]\n    fn test_new() {\n        let points = vec![\n            Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(0)),\n            Point::new(DatabaseIntegerUnit::from(5), DatabaseIntegerUnit::from(5)),\n        ];\n        let polygon = Polygon::new(points.clone(), 3, 2);\n\n        assert_eq!(polygon.layer(), 3);\n        assert_eq!(polygon.data_type(), 2);\n        assert_eq!(polygon.points().len(), 3);\n        assert_eq!(polygon.points()[0], points[0]);\n        assert_eq!(polygon.points()[1], points[1]);\n        assert_eq!(polygon.points()[2], points[0]); // Closed\n    }\n\n    #[test]\n    fn test_getters() {\n        let polygon = create_square();\n        assert_eq!(polygon.layer(), 1);\n        assert_eq!(polygon.data_type(), 0);\n        assert_eq!(polygon.points().len(), 5); // 4 + 1 to close\n    }\n\n    #[test]\n    fn test_area_square() {\n        let polygon = create_square();\n        let expected_area = DatabaseIntegerUnit::from(100); // 10 * 10\n        assert_eq!(polygon.area(), expected_area);\n    }\n\n    #[test]\n    fn test_area_triangle() {\n        let polygon = create_triangle();\n        let expected_area = DatabaseIntegerUnit::from(25); // 0.5 * base * height = 0.5 * 10 * 5\n        assert_eq!(polygon.area(), expected_area);\n    }\n\n    #[test]\n    fn test_perimeter_square() {\n        let polygon = create_square();\n        let expected_perimeter = DatabaseIntegerUnit::from(40); // 4 * 10\n        assert_eq!(polygon.perimeter(), expected_perimeter);\n    }\n\n    #[test]\n    fn test_is_point_inside() {\n        let polygon = create_square();\n\n        let inside_point = Point::new(DatabaseIntegerUnit::from(5), DatabaseIntegerUnit::from(5));\n        assert!(polygon.is_point_inside(\u0026inside_point));\n\n        let outside_point = Point::new(DatabaseIntegerUnit::from(15), DatabaseIntegerUnit::from(5));\n        assert!(!polygon.is_point_inside(\u0026outside_point));\n\n        let vertex_point = Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(0));\n        assert!(polygon.is_point_inside(\u0026vertex_point) || polygon.is_point_on_edge(\u0026vertex_point));\n    }\n\n    #[test]\n    fn test_is_point_on_edge() {\n        let polygon = create_square();\n\n        let edge_point = Point::new(DatabaseIntegerUnit::from(5), DatabaseIntegerUnit::from(0));\n        assert!(polygon.is_point_on_edge(\u0026edge_point));\n\n        let not_on_edge = Point::new(DatabaseIntegerUnit::from(5), DatabaseIntegerUnit::from(5));\n        assert!(!polygon.is_point_on_edge(\u0026not_on_edge));\n\n        let vertex_point = Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(0));\n        assert!(polygon.is_point_on_edge(\u0026vertex_point));\n    }\n\n    #[test]\n    fn test_display() {\n        let polygon = create_square();\n        let display_str = format!(\"{polygon}\");\n        assert!(display_str.contains(\"Polygon with 5 point(s)\"));\n        assert!(display_str.contains(\"starting at (0, 0)\"));\n        assert!(display_str.contains(\"layer 1\"));\n        assert!(display_str.contains(\"data type 0\"));\n    }\n\n    #[test]\n    fn test_clone() {\n        let polygon = create_square();\n        let cloned = polygon.clone();\n        assert_eq!(polygon.points(), cloned.points());\n        assert_eq!(polygon.layer(), cloned.layer());\n        assert_eq!(polygon.data_type(), cloned.data_type());\n    }\n\n    #[test]\n    fn test_partial_eq() {\n        let polygon1 = create_square();\n        let polygon2 = create_square();\n        let polygon3 = create_triangle();\n\n        assert_eq!(polygon1, polygon2);\n        assert_ne!(polygon1, polygon3);\n    }\n\n    #[test]\n    fn test_transformable_translation() {\n        let polygon = create_square();\n        let translation = Translation::new(Point::new(\n            DatabaseIntegerUnit::from(5),\n            DatabaseIntegerUnit::from(3),\n        ));\n\n        let transformed = polygon.transform(translation);\n\n        assert_eq!(transformed.points()[0].x(), DatabaseIntegerUnit::from(5));\n        assert_eq!(transformed.points()[0].y(), DatabaseIntegerUnit::from(3));\n    }\n\n    #[test]\n    fn test_transformable_rotation() {\n        let polygon = create_square();\n        let rotation = Rotation::new(PI / 2.0, Point::new(0, 0));\n\n        let transformed = polygon.transform(rotation);\n\n        assert_eq!(transformed.points().len(), polygon.points().len());\n        assert_eq!(transformed.area(), polygon.area());\n    }\n\n    #[test]\n    fn test_transformable_scale() {\n        let polygon = create_square();\n        let scale = Scale::new(\n            2.0,\n            Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(0)),\n        );\n\n        let transformed = polygon.transform(scale);\n\n        assert_eq!(\n            transformed.area(),\n            polygon.area() * DatabaseIntegerUnit::from(4)\n        );\n    }\n\n    #[test]\n    fn test_transformable_reflection() {\n        let polygon = create_square();\n        let reflection = Reflection::new_horizontal();\n\n        let transformed = polygon.transform(reflection);\n\n        assert_eq!(transformed.area(), polygon.area());\n        assert_eq!(transformed.points().len(), polygon.points().len());\n    }\n\n    #[test]\n    fn test_movable_move_to() {\n        let polygon = create_square();\n        let target = Point::new(\n            DatabaseIntegerUnit::from(100),\n            DatabaseIntegerUnit::from(200),\n        );\n\n        let moved = polygon.move_to(target);\n\n        assert_eq!(moved.points()[0].x(), DatabaseIntegerUnit::from(100));\n        assert_eq!(moved.points()[0].y(), DatabaseIntegerUnit::from(200));\n\n        assert_eq!(moved.area(), polygon.area());\n    }\n\n    #[test]\n    fn test_dimensions_bounding_box() {\n        let polygon = create_square();\n        let (min_point, max_point) = polygon.bounding_box();\n\n        assert_eq!(min_point.x(), DatabaseIntegerUnit::from(0));\n        assert_eq!(min_point.y(), DatabaseIntegerUnit::from(0));\n        assert_eq!(max_point.x(), DatabaseIntegerUnit::from(10));\n        assert_eq!(max_point.y(), DatabaseIntegerUnit::from(10));\n    }\n\n    #[test]\n    fn test_empty_polygon() {\n        let empty_points: Vec\u003cPoint\u003cDatabaseIntegerUnit\u003e\u003e = vec![];\n        let polygon = Polygon::new(empty_points, 0, 0);\n\n        assert_eq!(polygon.points().len(), 0);\n        assert_eq!(polygon.area(), DatabaseIntegerUnit::from(0));\n    }\n\n    #[test]\n    fn test_single_point_polygon() {\n        let single_point = vec![Point::new(\n            DatabaseIntegerUnit::from(5),\n            DatabaseIntegerUnit::from(5),\n        )];\n        let polygon = Polygon::new(single_point, 0, 0);\n\n        assert_eq!(polygon.points().len(), 1);\n        assert_eq!(polygon.area(), DatabaseIntegerUnit::from(0));\n    }\n\n    #[test]\n    fn test_already_closed_polygon() {\n        let points = vec![\n            Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(0)),\n            Point::new(DatabaseIntegerUnit::from(5), DatabaseIntegerUnit::from(0)),\n            Point::new(DatabaseIntegerUnit::from(5), DatabaseIntegerUnit::from(5)),\n            Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(0)),\n        ];\n        let polygon = Polygon::new(points.clone(), 0, 0);\n\n        assert_eq!(polygon.points().len(), points.len());\n    }\n\n    #[test]\n    fn test_transformation_rotation_and_scale_area_and_points() {\n        let polygon = create_square();\n        let original_area = polygon.area();\n\n        let rotation = Rotation::new(PI / 2.0, Point::new(0, 0));\n        let scale = Scale::new(2.0, Point::new(0, 0));\n\n        let mut transformation = Transformation::from(rotation);\n        let transformation = transformation.with_scale(Some(scale));\n        let transformed = polygon.transform(transformation);\n\n        let expected_area = original_area * DatabaseIntegerUnit::from(4);\n        assert_eq!(transformed.area(), expected_area);\n\n        let expected_points = vec![\n            Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(0)),\n            Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(20)),\n            Point::new(\n                DatabaseIntegerUnit::from(-20),\n                DatabaseIntegerUnit::from(20),\n            ),\n            Point::new(DatabaseIntegerUnit::from(-20), DatabaseIntegerUnit::from(0)),\n            Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(0)),\n        ];\n\n        assert_eq!(transformed.points(), expected_points);\n    }\n}\n","traces":[{"line":19,"address":[1169280,1169421,1169415],"length":1,"stats":{"Line":3}},{"line":21,"address":[1657699],"length":1,"stats":{"Line":2}},{"line":22,"address":[1657704],"length":1,"stats":{"Line":3}},{"line":23,"address":[1657748],"length":1,"stats":{"Line":2}},{"line":30,"address":[1660560],"length":1,"stats":{"Line":5}},{"line":36,"address":[1660600],"length":1,"stats":{"Line":22}},{"line":43,"address":[1169552],"length":1,"stats":{"Line":2}},{"line":44,"address":[1660693],"length":1,"stats":{"Line":3}},{"line":48,"address":[1660672],"length":1,"stats":{"Line":3}},{"line":49,"address":[1660677],"length":1,"stats":{"Line":2}},{"line":53,"addres me","matthew","develop","personal","gdsr","crates","gdsr_core","src","elements","polygon","utils.rs"],"content":"use crate::{CoordNum, Point};\n\nfn are_points_closed\u003cDatabaseUnitT: CoordNum\u003e(points: \u0026[Point\u003cDatabaseUnitT\u003e]) -\u003e bool {\n    let points_vec: Vec\u003cPoint\u003cDatabaseUnitT\u003e\u003e = points.to_vec();\n    if points_vec.is_empty() {\n        return true;\n    }\n    points_vec.first() == points_vec.last()\n}\n\npub fn close_points\u003cDatabaseUnitT: CoordNum\u003e(\n    points: impl IntoIterator\u003cItem = impl Into\u003cPoint\u003cDatabaseUnitT\u003e\u003e\u003e,\n) -\u003e Vec\u003cPoint\u003cDatabaseUnitT\u003e\u003e {\n    let mut points_vec = points.into_iter().map(Into::into).collect::\u003cVec\u003c_\u003e\u003e();\n    if !are_points_closed(\u0026points_vec) {\n        points_vec.push(points_vec[0]);\n    }\n    points_vec\n}\n\npub fn get_correct_polygon_points_format\u003cDatabaseUnitT: CoordNum\u003e(\n    points: impl IntoIterator\u003cItem = impl Into\u003cPoint\u003cDatabaseUnitT\u003e\u003e\u003e,\n) -\u003e Vec\u003cPoint\u003cDatabaseUnitT\u003e\u003e {\n    close_points(points)\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::DatabaseIntegerUnit;\n\n    #[test]\n    fn test_are_points_closed_true() {\n        let points = vec![\n            Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(0)),\n            Point::new(DatabaseIntegerUnit::from(1), DatabaseIntegerUnit::from(0)),\n            Point::new(DatabaseIntegerUnit::from(1), DatabaseIntegerUnit::from(1)),\n            Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(0)), // Same as first\n        ];\n        assert!(are_points_closed(\u0026points));\n    }\n\n    #[test]\n    fn test_are_points_closed_false() {\n        let points = vec![\n            Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(0)),\n            Point::new(DatabaseIntegerUnit::from(1), DatabaseIntegerUnit::from(0)),\n            Point::new(DatabaseIntegerUnit::from(1), DatabaseIntegerUnit::from(1)),\n            Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(1)), // Different from first\n        ];\n        assert!(!are_points_closed(\u0026points));\n    }\n\n    #[test]\n    fn test_are_points_closed_single_point() {\n        let points = vec![Point::new(\n            DatabaseIntegerUnit::from(5),\n            DatabaseIntegerUnit::from(5),\n        )];\n        // Single point is considered closed (first == last)\n        assert!(are_points_closed(\u0026points));\n    }\n\n    #[test]\n    fn test_are_points_closed_two_same_points() {\n        let points = vec![\n            Point::new(DatabaseIntegerUnit::from(3), DatabaseIntegerUnit::from(4)),\n            Point::new(DatabaseIntegerUnit::from(3), DatabaseIntegerUnit::from(4)),\n        ];\n        assert!(are_points_closed(\u0026points));\n    }\n\n    #[test]\n    fn test_are_points_closed_empty() {\n        let points: Vec\u003cPoint\u003cDatabaseIntegerUnit\u003e\u003e = vec![];\n        // Empty vector: first() and last() both return None, so None == None is true\n        assert!(are_points_closed(\u0026points));\n    }\n\n    #[test]\n    fn test_close_points_already_closed() {\n        let points = vec![\n            Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(0)),\n            Point::new(DatabaseIntegerUnit::from(5), DatabaseIntegerUnit::from(0)),\n            Point::new(DatabaseIntegerUnit::from(5), DatabaseIntegerUnit::from(5)),\n            Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(0)), // Already closed\n        ];\n        let closed = close_points(points.clone());\n\n        // Should return same points since already closed\n        assert_eq!(closed.len(), points.len());\n        assert_eq!(closed, points);\n    }\n\n    #[test]\n    fn test_close_points_not_closed() {\n        let points = vec![\n            Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(0)),\n            Point::new(DatabaseIntegerUnit::from(5), DatabaseIntegerUnit::from(0)),\n            Point::new(DatabaseIntegerUnit::from(5), DatabaseIntegerUnit::from(5)),\n            Point::new(DatabaseIntegerUnit::from(0), DatabaseIntegerUnit::from(5)), // Not closed\n        ];\n        let closed = close_points(points.clone());\n\n        // Should add closing point\n        assert_eq!(closed.len(), points.len() + 1);\n        assert_eq!(closed[0], points[0]); // First point\n        assert_eq!(closed[closed.len() - 1], points[0]); // Last point should match first\n\n        // All original points should be preserved\n        for (i, original_point) in points.iter().enumerate() {\n            assert_eq!(closed[i], *original_point);\n        }\n    }\n\n    #[test]\n    fn test_close_points_single_point() {\n        let points = vec![Point::new(\n            DatabaseIntegerUnit::from(7),\n            DatabaseIntegerUnit::from(3),\n        )];\n        let closed = close_points(points.clone());\n\n        // Single point is already \"closed\", should return unchanged\n        assert_eq!(closed.len(), 1);\n        assert_eq!(closed, points);\n    }\n\n    #[test]\n    fn test_close_points_two_different_points() {\n        let points = vec![\n            Point::new(DatabaseIntegerUnit::from(1), DatabaseIntegerUnit::from(2)),\n            Point::new(DatabaseIntegerUnit::from(3), DatabaseIntegerUnit::from(4)),\n        ];\n        let closed = close_points(points.clone());\n\n        // Should add closing point\n        assert_eq!(closed.len(), 3);\n        assert_eq!(closed[0], points[0]);\n        assert_eq!(closed[1], points[1]);\n        assert_eq!(closed[2], points[0]); // Closing point\n    }\n\n    #[test]\n    fn test_close_points_empty() {\n        let points: Vec\u003cPoint\u003cDatabaseIntegerUnit\u003e\u003e = vec![];\n        let closed = close_points(points.clone());\n\n        // Empty should remain empty\n        assert_eq!(closed.len(), 0);\n        assert_eq!(closed, points);\n    }\n\n    #[test]\n    fn test_get_correct_polygon_points_format_open() {\n        let points = vec![\n            Point::new(DatabaseIntegerUnit::from(10), DatabaseIntegerUnit::from(20)),\n            Point::new(DatabaseIntegerUnit::from(30), DatabaseIntegerUnit::from(20)),\n            Point::new(DatabaseIntegerUnit::from(30), DatabaseIntegerUnit::from(40)),\n        ];\n        let formatted = get_correct_polygon_points_format(points.clone());\n\n        // Should close the polygon\n        assert_eq!(formatted.len(), points.len() + 1);\n        assert_eq!(formatted[0], points[0]);\n        assert_eq!(formatted[formatted.len() - 1], points[0]);\n    }\n\n    #[test]\n    fn test_get_correct_polygon_points_format_closed() {\n        let points = vec![\n            Point::new(DatabaseIntegerUnit::from(10), DatabaseIntegerUnit::from(20)),\n            Point::new(DatabaseIntegerUnit::from(30), DatabaseIntegerUnit::from(20)),\n            Point::new(DatabaseIntegerUnit::from(30), DatabaseIntegerUnit::from(40)),\n            Point::new(DatabaseIntegerUnit::from(10), DatabaseIntegerUnit::from(20)), // Already closed\n        ];\n        let formatted = get_correct_polygon_points_format(points.clone());\n\n        // Should remain unchanged\n        assert_eq!(formatted.len(), points.len());\n        assert_eq!(formatted, points);\n    }\n\n    #[test]\n    fn test_get_correct_polygon_points_format_empty() {\n        let points: Vec\u003cPoint\u003cDatabaseIntegerUnit\u003e\u003e = vec![];\n        let formatted = get_correct_polygon_points_format(points.clone());\n\n        // Empty should remain empty\n        assert_eq!(formatted.len(), 0);\n        assert_eq!(formatted, points);\n    }\n\n    #[test]\n    fn test_get_correct_polygon_points_format_single() {\n        let points = vec![Point::new(\n            DatabaseIntegerUnit::from(100),\n            DatabaseIntegerUnit::from(200),\n        )];\n        let formatted = get_correct_polygon_points_format(points.clone());\n\n        // Single point should remain single (already \"closed\")\n        assert_eq!(formatted.len(), 1);\n        assert_eq!(formatted, points);\n    }\n\n    #[test]\n    fn test_polygon_formats_preserve_order() {\n        let points = vec![\n            Point::new(DatabaseIntegerUnit::from(1), DatabaseIntegerUnit::from(1)),\n            Point::new(DatabaseIntegerUnit::from(2), DatabaseIntegerUnit::from(1)),\n            Point::new(DatabaseIntegerUnit::from(3), DatabaseIntegerUnit::from(2)),\n            Point::new(DatabaseIntegerUnit::from(2), DatabaseIntegerUnit::from(3)),\n            Point::new(DatabaseIntegerUnit::from(1), DatabaseIntegerUnit::from(2)),\n        ];\n        let formatted = get_correct_polygon_points_format(points.clone());\n\n        // Should preserve order and add closing point\n        assert_eq!(formatted.len(), points.len() + 1);\n        for (i, point) in points.iter().enumerate() {\n            assert_eq!(formatted[i], *point);\n        }\n        assert_eq!(formatted[formatted.len() - 1], points[0]); // Closing point\n    }\n\n    #[test]\n    fn test_floating_point_coordinates() {\n        let points = vec![\n            Point::new(1.5f64, 2.5f64),\n            Point::new(3.7f64, 2.5f64),\n            Point::new(3.7f64, 4.1f64),\n        ];\n        let formatted = get_correct_polygon_points_format(points.clone());\n\n        // Should work with floating point coordinates\n        assert_eq!(formatted.len(), points.len() + 1);\n        assert_eq!(formatted[0], points[0]);\n        assert_eq!(formatted[formatted.len() - 1], points[0]);\n    }\n}\n","traces":[{"line":3,"address":[1108354,1108348,1108661,1108064,1108667,1108368],"length":1,"stats":{"Line":6}},{"line":4,"address":[1697082],"length":1,"stats":{"Line":23}},{"line":5,"address":[1697162,1697106],"length":1,"stats":{"Line":29}},{"line":6,"address":[1697194],"length":1,"stats":{"Line":1} t::Reference);\ninto_instance_impl!(Text\u003cDatabaseUnitT\u003e, Element::Text);\n\nimpl\u003cDatabaseUnitT: CoordNum\u003e From\u003cCell\u003cDatabaseUnitT\u003e\u003e for Instance\u003cDatabaseUnitT\u003e {\n    fn from(value: Cell\u003cDatabaseUnitT\u003e) -\u003e Self {\n        Self::Cell(value)\n    }\n}\n","traces":[{"line":15,"address":[1698096],"length":1,"stats":{"Line":0}},{"line":16,"address":[1698112],"length":1,"stats":{"Line":0}},{"line":23,"address":[1698160],"length":1,"stats":{"Line":3}},{"line":24,"address":[1698176],"length":1,"stats":{"Line":3}},{"line":29,"address":[1787408,1787344,1787472],"length":1,"stats":{"Line":3}},{"line":30,"address":[1787361,1787425,1787475],"length":1,"stats":{"Line":3}}],"covered":4,"coverable":6},{"path":["/","home","matthew","develop","personal","gdsr","crates","gdsr_core","src","elements","reference","io.rs"],"content":"use std::{fs::File, io};\n\nuse geo::algorithm::rotate::Rotate;\n\nuse super::{Instance, Reference};\nuse crate::{\n    CoordNum,\n    config::gds_file_types::{GDSDataType, GDSRecord, combine_record_and_data_type},\n    elements::Element,\n    traits::ToGds,\n    utils::{\n        general::point_to_database_float,\n        io::{\n            write_element_tail_to_file, write_points_to_file, write_string_with_record_to_file,\n            write_transformation_to_file, write_u16_array_to_file,\n        },\n    },\n};\n\nimpl\u003cDatabaseUnitT: CoordNum\u003e ToGds for Reference\u003cDatabaseUnitT\u003e {\n    fn to_gds_impl(\u0026self, file: \u0026mut File, scale: f64) -\u003e io::Result\u003c()\u003e {\n        match \u0026self.instance {\n            Instance::Cell(cell) =\u003e self.to_gds_impl_with_cell(file, scale, \u0026cell.name),\n            Instance::Element(element) =\u003e {\n                self.to_gds_impl_with_element(file, scale, element.as_ref().as_ref())\n            }\n        }\n    }\n}\n\nimpl\u003cDatabaseUnitT: CoordNum\u003e Reference\u003cDatabaseUnitT\u003e {\n    fn to_gds_impl_with_element(\n        \u0026self,\n        file: \u0026mut File,\n        scale: f64,\n        element: \u0026Element\u003cDatabaseUnitT\u003e,\n    ) -\u003e io::Result\u003c()\u003e {\n        for element in self.get_elements_in_grid(element) {\n            element.to_gds_impl(file, scale)?;\n        }\n\n        Ok(())\n    }\n\n    fn to_gds_impl_with_cell(\n        \u0026self,\n        file: \u0026mut File,\n        scale: f64,\n        cell_name: \u0026str,\n    ) -\u003e io::Result\u003c()\u003e {\n        let buffer_start = [\n            4,\n            combine_record_and_data_type(GDSRecord::ARef, GDSDataType::NoData),\n        ];\n\n        write_u16_array_to_file(file, \u0026buffer_start)?;\n\n        write_string_with_record_to_file(file, GDSRecord::SName, cell_name)?;\n\n        write_transformation_to_file(\n            file,\n            self.grid.angle,\n            self.grid.magnification,\n            self.grid.x_reflection,\n        )?;\n\n        let buffer_array = [\n            8,\n            combine_record_and_data_type(GDSRecord::ColRow, GDSDataType::TwoByteSignedInteger),\n            self.grid.columns as u16,\n            self.grid.rows as u16,\n        ];\n\n        write_u16_array_to_file(file, \u0026buffer_array)?;\n\n        let origin = point_to_database_float(self.grid.origin);\n        let point2 = point_to_database_float(self.grid.origin + self.grid.spacing_x)\n            * f64::from(self.grid.columns);\n        let point3 = point_to_database_float(self.grid.origin + self.grid.spacing_y)\n            * f64::from(self.grid.rows);\n\n        let reference_points: Vec\u003c_\u003e = [origin, point2, point3]\n            .iter()\n            .map(|\u0026p| p.rotate_around_point(self.grid.angle, origin))\n            .collect();\n\n        write_points_to_file(file, \u0026reference_points, scale, \u0026|val| val.to_integer())?;\n\n        write_element_tail_to_file(file)\n    }\n}\n","traces":[{"line":21,"address":[],"length th":1,"stats":{"Line":0}},{"line":89,"address":[1646595],"length":1,"stats":{"Line":0}}],"covered":0,"coverable":34},{"path":["/","home","matthew","develop","personal","gdsr","crates","gdsr_core","src","elements","reference","mod.rs"],"content":"use geo::Rotate;\n\nuse crate::{\n    CoordNum, DatabaseIntegerUnit, Movable, Point, elements::Element, grid::Grid,\n    traits::Transformable, transformation::Transformation, utils::general::point_to_database_float,\n};\n\npub mod instance;\npub mod io;\n\npub use instance::Instance;\n\n#[derive(Clone, Debug, PartialEq)]\npub struct Reference\u003cDatabaseUnitT: CoordNum = DatabaseIntegerUnit\u003e {\n    pub(crate) instance: Instance\u003cDatabaseUnitT\u003e,\n    pub(crate) grid: Grid\u003cDatabaseUnitT\u003e,\n}\n\nimpl\u003cDatabaseUnitT: CoordNum\u003e Default for Reference\u003cDatabaseUnitT\u003e {\n    fn default() -\u003e Self {\n        Self {\n            instance: Instance::default(),\n            grid: Grid::default(),\n        }\n    }\n}\n\nimpl\u003cDatabaseUnitT: CoordNum\u003e Reference\u003cDatabaseUnitT\u003e {\n    pub fn new(instance: impl Into\u003cInstance\u003cDatabaseUnitT\u003e\u003e, grid: Grid\u003cDatabaseUnitT\u003e) -\u003e Self {\n        Self {\n            instance: instance.into(),\n            grid,\n        }\n    }\n\n    pub const fn instance(\u0026self) -\u003e \u0026Instance\u003cDatabaseUnitT\u003e {\n        \u0026self.instance\n    }\n\n    pub const fn grid(\u0026self) -\u003e \u0026Grid\u003cDatabaseUnitT\u003e {\n        \u0026self.grid\n    }\n\n    pub fn get_elements_in_grid(\n        \u0026self,\n        element: \u0026Element\u003cDatabaseUnitT\u003e,\n    ) -\u003e Vec\u003cElement\u003cDatabaseUnitT\u003e\u003e {\n        let grid = self.grid();\n\n        let mut elements: Vec\u003cElement\u003cDatabaseUnitT\u003e\u003e =\n            Vec::with_capacity((grid.columns * grid.rows) as usize);\n\n        for column_index in 0..grid.columns {\n            let column_origin  fn bounding_box\u003cT: CoordNum\u003e(points: \u0026[Point\u003cT\u003e]) -\u003e (Point\u003cT\u003e, Point\u003cT\u003e) {\n    if points.is_empty() {\n        return (\n            Point::new(T::zero(), T::zero()),\n            Point::new(T::zero(), T::zero()),\n        );\n    }\n\n    // Use geo's BoundingRect trait for robust calculation\n    let multipoint = geo::MultiPoint::new(points.to_vec());\n    multipoint.bounding_rect().map_or_else(\n        || {\n            let first = points[0];\n            (first, first)\n        },\n        |rect| {\n            let min_point = Point::new(rect.min().x, rect.min().y);\n            let max_point = Point::new(rect.max().x, rect.max().y);\n            (min_point, max_point)\n        },\n    )\n}\n\n/// Calculate the area of a polygon defined by points using the shoelace formula\n/// Points should be in order (clockwise or counter-clockwise)\npub fn area\u003cDatabaseUnitT: CoordNum\u003e(points: \u0026[Point\u003cDatabaseUnitT\u003e]) -\u003e DatabaseUnitT {\n    if points.len() \u003c 3 {\n        return DatabaseUnitT::zero();\n    }\n\n    let coords = to_float_coords(points);\n\n    // Close the polygon by adding the first point at the end if not already closed\n    let mut closed_coords = coords;\n    if let (Some(first), Some(last)) = (closed_coords.first(), closed_coords.last()) {\n        if first != last {\n            closed_coords.push(*first);\n        }\n    }\n\n    let linestring = LineString::new(closed_coords);\n    let polygon = Polygon::new(linestring, vec![]);\n\n    DatabaseUnitT::from_float(polygon.unsigned_area().abs())\n}\n\n/// Calculate the perimeter of a polygon defined by points\n/// For open polygons, calculates the total length of all segments\n/// For closed polygons, includes the segment from last to first point\npub fn perimeter\u003cDatabaseUnitT: CoordNum\u003e(points: \u0026[Point\u003cDatabaseUnitT\u003e]) -\u003e DatabaseUnitT {\n    if points.len() \u003c 2 {\n        return DatabaseUnitT::zero();\n    }\n\n    let coords = to_float_coords(points);\n\n    let linestring = LineString::new(coords);\n\n    DatabaseUnitT::from_float(linestring.euclidean_length())\n}\n\n/// Check if a point is inside a polygon using the ray casting algorithm\n/// The polygon is defined by an ordered list of points\npub fn is_point_inside\u003cDatabaseUnitT: CoordNum\u003e(\n    point: \u0026Point\u003cDatabaseUnitT\u003e,\n    polygon_points: \u0026[Point\u003cDatabaseUnitT\u003e],\n) -\u003e bool {\n    if polygon_points.len() \u003c 3 {\n        return false;\n    }\n\n    let coords = to_float_coords(polygon_points);\n\n    // Ensure the polygon is closed\n    let mut closed_coords = coords;\n    if let (Some(first), Some(last)) = (closed_coords.first(), closed_coords.last()) {\n        if first != last {\n            closed_coords.push(*first);\n        }\n    }\n\n    let linestring = LineString::new(closed_coords);\n    let polygon = Polygon::new(linestring, vec![]);\n\n    polygon.contains(\u0026point_to_database_float(*point))\n}\n\n/// Check if a point lies on the edge of a polygon\npub fn is_point_on_edge\u003cT: CoordNum\u003e(point: \u0026Point\u003cT\u003e, polygon_points: \u0026[Point\u003cT\u003e]) -\u003e bool {\n    if polygon_points.len() \u003c 2 {\n        return false;\n    }\n\n    let num_points = polygon_points.len();\n    for i in 0..num_points {\n        let start = \u0026polygon_points[i];\n        let end = \u0026polygon_points[(i + 1) % num_points];\n\n        if is_point_on_line_segment(point, start, end) {\n            return true;\n        }\n    }\n    false\n}\n\n/// Check if a point lies on a line segment\npub fn is_point_on_line_segment\u003cT: CoordNum\u003e(point: \u0026Point\u003cT\u003e, a: \u0026Point\u003cT\u003e, b: \u0026Point\u003cT\u003e) -\u003e bool {\n    let line_segment = Line::new(\n        Coord {\n            x: a.x().to_float(),\n            y: a.y().to_float(),\n        },\n        Coord {\n            x: b.x().to_float(),\n            y: b.y().to_float(),\n        },\n    );\n    line_segment.contains(\u0026point_to_database_float(*point))\n}\n\n/// Round a floating point value to a specified number of decimal places\npub fn round_to_decimals(value: f64, ndigits: u32) -\u003e f64 {\n    let factor = 10f64.powi(ndigits as i32);\n    (value * factor).round() / factor\n}\n\n#[cfg(test)]\nmod tests {\n    use approx::assert_relative_eq;\n\n    use super::*;\n\n    #[test]\n    fn test_bounding_box() {\n        let points = vec![\n            Point::new(1.0, 2.0),\n            Point::new(4.0, 6.0),\n            Point::new(-1.0, 3.0),\n            Point::new(2.0, -1.0),\n        ];\n\n        let (min_point, max_point) = bounding_box(\u0026points);\n        assert_eq!(min_point, Point::new(-1.0, -1.0));\n        assert_eq!(max_point, Point::new(4.0, 6.0));\n    }\n\n    #[test]\n    fn test_area() {\n        // Square with side length 2\n        let square = vec![\n            Point::new(0.0, 0.0),\n            Point::new(2.0, 0.0),\n            Point::new(2.0, 2.0),\n            Point::new(0.0, 2.0),\n        ];\n\n        let area_result = area(\u0026square);\n        assert_relative_eq!(area_result, 4.0, epsilon = 1e-10);\n    }\n\n    #[test]\n    fn test_point_inside() {\n        let square = vec![\n            Point::new(0.0, 0.0),\n            Point::new(2.0, 0.0),\n            Point::new(2.0, 2.0),\n            Point::new(0.0, 2.0),\n        ];\n\n        assert!(is_point_inside(\u0026Point::new(1.0, 1.0), \u0026square));\n        assert!(!is_point_inside(\u0026Point::new(3.0, 3.0), \u0026square));\n    }\n\n    #[test]\n    fn test_point_on_edge() {\n        let triangle = vec![\n            Point::new(0.0, 0.0),\n            Point::new(2.0, 0.0),\n            Point::new(1.0, 2.0),\n        ];\n\n        assert!(is_point_on_edge(\u0026Point::new(1.0, 0.0), \u0026triangle));\n        assert!(!is_point_on_edge(\u0026Point::new(1.0, 1.0), \u0026triangle));\n    }\
